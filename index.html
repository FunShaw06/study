const ANS_HINT = '格式随意，例如 26-30 BDACE 或 26B 27D…；可以分多行；也可以只写字母，按题号顺序依次对应。';

/* 把弹窗里输入的答案套用到题目上（预览与保存共用，保证"看到的"和"保存的"一致） */
function applyAnswerInput(r, av) {
  const qs = allQuestions(r);
  let applied = 0, unmatched = [];
  if (av && av.trim()) {
    const pairs = parseAnswerPairs(norm(av).toUpperCase());
    const keys = Object.keys(pairs).map(Number);
    if (keys.length) {
      qs.forEach(q => { if (pairs[q.no]) { q.ans = pairs[q.no]; applied++; } });
      // 只有 26-55（阅读部分）范围内的题号才算"对不上"。
      // 答案文件里天然包含听力答案 1-25，那不属于本卷范围，不能当成错误。
      unmatched = keys.filter(no => no >= 26 && no <= 55 && !qs.some(q => q.no === no));
    } else {
      const res = applyAnswers(r, av);
      applied = res.applied;
    }
  }
  return { applied, total: qs.length, missing: qs.filter(q => !q.ans).map(q => q.no), unmatched };
}

function ansCountFromUI() {
  if (!pending) return { applied: 0, total: 0, missing: [], unmatched: [] };
  const av = ($('#mAns') || {}).value || '';
  const tmp = { sections: pending.r.sections };
  if (!av.trim()) {
    const qs = allQuestions(tmp);
    return { applied: qs.filter(q => q.ans).length, total: qs.length, missing: qs.filter(q => !q.ans).map(q => q.no), unmatched: [] };
  }
  return applyAnswerInput(tmp, av);
}

/* ===================== 保存 ===================== */
function savePaper() {
  if (!pending) return;
  const val = id => (($('#' + id) || {}).value || '').trim();
  const meta = {
    language: val('mLang') || '未分类',
    exam: val('mExam'), level: val('mLevel'),
    year: val('mYear'), month: val('mMonth'), set: val('mSet'),
    type: val('mType'), source: val('mSource')
  };
  const label = buildLabel(meta, pending.name);

  // 用用户输入重建题目对象上的答案（关键修复：手填答案必须覆盖）
  const av = (($('#mAns') || {}).value || '');
  const res = applyAnswerInput(pending.r, av);
  const total = res.total;
  const withAns = total - res.missing.length;

  // 保存前校验
  const problems = [];
  if (total !== 30) problems.push('题目数量是 ' + total + ' 题（标准 30 题）');
  if (withAns < total) problems.push('还有 ' + (total - withAns) + ' 题没有答案：' + res.missing.join('、'));
  if (res.unmatched.length) problems.push('有 ' + res.unmatched.length + ' 个答案题号（' + res.unmatched.join('、') + '）在卷子里找不到对应题目');

  const finish = () => {
    const paper = Object.assign({
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      label, sections: pending.r.sections,
      created: Date.now(), hash: pending.hash
    }, meta);
    papers.push(paper);
    store.set('plsc_papers', papers);
    const msg = '已保存：' + label + '（' + total + ' 题，答案 ' + withAns + '/' + total + '）';
    pending = null;
    closeModal();
    toast(msg);
    nextFile();
  };

  // 重复检测
  if (settings.duplicateCheck && papers.some(p => p.hash === pending.hash)) {
    ask('可能重复', '资料库里已经有一份内容相同的资料，还要继续保存吗？', '仍然保存', finish);
    return;
  }
  if (problems.length && pending.r.total) {
    ask('数据不完整', '检测到：' + problems.join('；') + '。仍然保存吗？（不完整的部分不计分，之后可以再补充）', '仍然保存', finish);
    return;
  }
  finish();
}

/* ===================== 文件队列 ===================== */
async function handleFile(file, idx, total) {
  const tag = (total > 1 ? '（' + idx + '/' + total + '）' : '');
  const report = msg => bootDiag('📄 正在处理 ' + file.name + tag + '：' + msg, false);
  try {
    report('准备读取…');
    const { text, isPdf } = await readAnyFile(file, report);
    if (!text || !text.trim()) {
      bootDiag('⚠ ' + file.name + '：文件里没有读到任何文字。', true);
      toast('文件里没有读到文字：' + file.name);
      return;
    }
    report('已读到 ' + text.length + ' 个字符，正在识别题目…');
    openPreview(file.name, text, isPdf, contentHash(text));
    bootDiag('✅ ' + file.name + ' 已解析完成，请在弹出的窗口里确认后保存。', false);
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    bootDiag('❌ ' + file.name + ' 读取失败：' + msg, true);
    toast('读取失败：' + msg);
  }
}
async function nextFile() {
  if (!queue.length) return;
  const f = queue.shift();
  await handleFile(f, 0, 0);
}
async function handleFiles(fs) {
  const arr = [...fs];
  if (!arr.length) return;
  const total = arr.length;
  bootDiag('📂 已选中 ' + total + ' 个文件，开始处理…' + arr.map(f => f.name).join('、'), false);
  for (let i = 0; i < arr.length; i++) {
    await handleFile(arr[i], i + 1, total);
  }
  bootDiag('✅ 这一批 ' + total + ' 个文件都处理完了。', false);
}

/* ===================== 练习 / 模考 ===================== */
function startPaper(id, mock) {
  const paper = papers.find(p => p.id === id);
  if (!paper) return;
  clearInterval(timerHandle);
  const qmap = {};
  paper.sections.forEach(sec => sec.blocks.forEach(b => b.questions.forEach(q => { q.type = sec.type; qmap[q.no] = q; })));
  const fc = paper.sections.find(s => s.type === 'cloze');
  session = {
    paper, answers: {}, submitted: false, tab: 0, qmap,
    active: fc && fc.blocks[0] && fc.blocks[0].questions[0] ? fc.blocks[0].questions[0].no : null,
    mock: !!mock, timeLeft: mock ? 2400 : null, historySaved: false, startedAt: Date.now()
  };
  sessionStart = Date.now(); sessionAccum = 0; sessionPaused = false;
  viewId = id; view = 'test'; render();
  if (mock) startTimer();
  startVisibilityWatcher();
}

function startTimer() {
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if (!session || !session.mock || session.submitted) { clearInterval(timerHandle); return; }
    if (sessionPaused) return;
    session.timeLeft--;
    const el = $('#countdown');
    if (el) {
      el.textContent = fmtTimer(session.timeLeft);
      el.classList.toggle('warn', session.timeLeft <= 300);
    }
    if (session.timeLeft <= 0) {
      clearInterval(timerHandle);
      toast('40 分钟到，正在自动交卷…');
      session.submitted = true;
      if (!session.historySaved) { saveHistoryEntry(); session.historySaved = true; }
      render();
    }
  }, 1000);
}

/* 有效学习时长 */
function startVisibilityWatcher() {
  if (startVisibilityWatcher.done) return;
  startVisibilityWatcher.done = true;
  ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(ev => {
    document.addEventListener(ev, () => { lastActivity = Date.now(); }, true);
  });
  document.addEventListener('visibilitychange', updatePause);
  setInterval(updatePause, 5000);
  window.addEventListener('beforeunload', () => { if (session && !session.submitted) commitAccum(); });
}
function updatePause() {
  if (!session || session.submitted) return;
  const hidden = document.hidden;
  const idle = (Date.now() - lastActivity) > (settings.autoPauseSeconds || 60) * 1000;
  const should = hidden || idle;
  if (should && !sessionPaused) { commitAccum(); sessionPaused = true; }
  else if (!should && sessionPaused) { sessionPaused = false; sessionStart = Date.now(); }
}
function commitAccum() {
  if (sessionStart) { sessionAccum += (Date.now() - sessionStart); sessionStart = Date.now(); }
}
function currentSessionDuration() {
  return sessionAccum + (sessionStart && !sessionPaused ? Date.now() - sessionStart : 0);
}

function calc() {
  const s = session, per = [];
  let right = 0, count = 0;
  s.paper.sections.forEach(sec => {
    const qs = allQuestions({ sections: [sec] });
    let r = 0, g = 0;
    qs.forEach(q => {
      if (q.ans) { g++; if (s.answers[q.no] === q.ans) r++; }
    });
    right += r; count += g;
    per.push({ short: sec.short, r, g, n: qs.length });
  });
  const score = count ? +(right / count * 100).toFixed(1) : 0;
  return { score, right, count, per };
}

function saveHistoryEntry() {
  const r = calc();
  const p = session.paper;
  history.push({
    id: Date.now(), paperId: p.id, label: p.label,
    language: p.language || '未分类', exam: p.exam || '',
    mode: session.mock ? '限时模考' : '普通练习',
    date: Date.now(), score: r.score, right: r.right, count: r.count,
    duration: Math.round(currentSessionDuration() / 1000),
    per: r.per.map(x => ({ short: x.short, r: x.r, g: x.g }))
  });
  saveHistory();
}

/* ===================== 生词 ===================== */
function toggleWord(w, sentence) {
  if (!w) return;
  const old = vocab.find(v => v.w === w);
  if (old) {
    vocab = vocab.filter(v => v.w !== w);
    toast('已移出生词本：' + w);
  } else {
    const now = Date.now();
    const p = session && session.paper;
    vocab.unshift({
      w, t: now, sentence: sentence || '', source: p ? p.label : '',
      language: p ? (p.language || '未分类') : '未分类', exam: p ? (p.exam || '') : '',
      meaning: '', nextReview: now, level: 0, reps: 0, interval: 1, mastered: false
    });
    toast('已加入生词本：' + w);
  }
  vocabSet = new Set(vocab.map(v => v.w));
  saveVocab();
  // 就地更新所有该单词的高亮，避免整页重绘丢失答题状态
  $$('.w').forEach(el => { if (el.dataset.w === w) el.classList.toggle('saved', vocabSet.has(w)); });
}

/* ===================== 复习流程 ===================== */
function intervals() {
  const arr = String(settings.intervals || '1,2,4,7,15,30').split(',').map(s => +s.trim()).filter(n => n > 0);
  return arr.length ? arr : [1, 2, 4, 7, 15, 30];
}

function startReview() {
  const now = Date.now();
  const list = dueWords()
    .filter(v => !reviewLangFilter || (v.language || '未分类') === reviewLangFilter)
    .slice(0, settings.dailyReview || 50);
  if (!list.length) { toast('今天没有需要复习的生词'); return; }
  session = { review: true, reviewList: list, reviewIndex: 0, stage: 'input', reviewInput: '', reviewStartAt: Date.now(), resultFlash: null };
  view = 'review'; render();
  startReviewTimer();
}

let reviewTimerHandle = null;
function startReviewTimer() {
  clearInterval(reviewTimerHandle);
  reviewTimerHandle = setInterval(() => {
    if (!session || !session.review || session.stage !== 'input') return;
    const el = $('#review-timer');
    if (!el) return;
    const secs = Math.floor((Date.now() - session.reviewStartAt) / 1000);
    const limit = settings.recognizeSeconds || 10;
    if (secs >= limit) {
      el.classList.add('over');
      el.textContent = '超过 ' + limit + ' 秒（建议判定为不熟）';
    } else {
      el.classList.toggle('warn', secs >= limit * 0.7);
      el.textContent = '计时 ' + secs + ' / ' + limit + ' 秒';
    }
  }, 1000);
}

function updateVocabAfterReview(v, rate) {
  const iv = intervals();
  if (rate === 'good') {
    v.level = Math.min((v.level || 0) + 1, iv.length - 1);
    v.interval = iv[v.level];
  } else if (rate === 'hard') {
    v.interval = Math.max(1, v.interval || 1);
  } else {
    v.level = 0;
    v.interval = iv[0];
  }
  v.reps = (v.reps || 0) + 1;
  v.lastReview = Date.now();
  v.nextReview = Date.now() + v.interval * DAY;
}

/* ===================== 导出 / 导入备份 ===================== */
function download(filename, text) {
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

function exportAll() {
  if (!papers.length && !vocab.length && !history.length) { toast('还没有可导出的数据'); return; }
  // 导出前校验完整性
  const bad = papers.filter(p => countQuestions(p) !== 30 || countAnswered(p) !== countQuestions(p));
  const payload = {
    app: 'plsc', version: 2, exportedAt: new Date().toISOString(),
    papers, vocab, history, settings
  };
  const stamp = new Date().toISOString().slice(0, 10);
  download('语言学习中心-备份-' + stamp + '.json', JSON.stringify(payload));
  if (bad.length) {
    toast('已导出，但有 ' + bad.length + ' 套资料题数或答案不完整（备份里已原样保留）');
  } else {
    toast('已导出：' + papers.length + ' 套资料 / ' + vocab.length + ' 个生词 / ' + history.length + ' 条记录');
  }
}

function exportVocab() {
  if (!vocab.length) { toast('生词本还是空的'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  download('生词本-' + stamp + '.json', JSON.stringify({ app: 'plsc', type: 'vocab', exportedAt: new Date().toISOString(), vocab }));
  toast('已导出 ' + vocab.length + ' 个生词');
}

function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try { data = JSON.parse(fr.result); } catch (e) { toast('备份文件不是合法的 JSON'); return; }
    const inPapers = Array.isArray(data.papers) ? data.papers : [];
    const inVocab = Array.isArray(data.vocab) ? data.vocab : (data.type === 'vocab' ? (data.vocab || []) : []);
    const inHistory = Array.isArray(data.history) ? data.history : [];
    if (!inPapers.length && !inVocab.length && !inHistory.length) { toast('备份文件里没有可导入的数据'); return; }

    const doImport = mode => {
      let addedP = 0, addedV = 0;
      if (mode !== 'vocabonly') {
        const seen = new Set(papers.map(p => p.id));
        inPapers.forEach(p => { if (!seen.has(p.id)) { papers.push(p); addedP++; } });
        const seenH = new Set(history.map(h => h.id));
        inHistory.forEach(h => { if (!seenH.has(h.id)) history.push(h); });
        store.set('plsc_papers', papers);
        saveHistory();
      }
      const seenW = new Set(vocab.map(v => v.w));
      inVocab.forEach(v => { if (!seenW.has(v.w)) { vocab.push(v); addedV++; } });
      saveVocab();
      render();
      toast('导入完成：新增 ' + addedP + ' 套资料 / ' + addedV + ' 个生词');
    };

    ask('导入备份', `备份里有 ${inPapers.length} 套资料、${inVocab.length} 个生词、${inHistory.length} 条记录。将按 id 合并到现有数据（不会覆盖已有内容）。`, '开始导入', () => doImport('merge'));
  };
  fr.readAsText(file, 'utf-8');
}

/* ===================== 事件绑定 ===================== */
function bindEvents() {
  // 导航
  document.addEventListener('click', e => {
    try {
      const el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (window.__bootLog) window.__bootLog.push('click:' + (el ? el.dataset.act : 'no-act'));
      bootDiag('👆 收到点击：' + (el ? ('按钮动作「' + el.dataset.act + '」' + (el.dataset.view ? ' → ' + el.dataset.view : '')) : '这个位置没有绑定动作') + '', false);
      if (!el) return;
      handleAction(el, e);
    } catch (err) {
      bootDiag('点击处理出错：' + (err && err.message ? err.message : err), true);
    }
  });

}

/* 所有按钮动作的处理（从事件监听里抽出来，便于加错误捕获） */
function handleAction(el, e) {
  const act = el.dataset.act;
  {
    switch (act) {
      case 'nav':
        if (session && view === 'test' && !session.submitted && !session.review) {
          if (!confirm('练习还没提交，确定离开吗？进度不会保存。')) return;
          clearInterval(timerHandle); session = null;
        }
        view = el.dataset.view; viewId = null; render(); window.scrollTo(0, 0); break;

      case 'dismissNotice':
        store.set(el.dataset.key, true);
        checkStorageSize();
        if (el.parentElement) el.parentElement.remove();
        break;

      case 'pickFile': $('#file').click(); break;
      case 'pickBackup': $('#backupFile').click(); break;
      case 'pickAnsFile': $('#ansFile').click(); break;

      case 'pasteText': pasteTextDialog(); break;

      case 'close': closeModal(); break;

      case 'detail':
        viewId = el.dataset.id; view = 'detail'; render(); window.scrollTo(0, 0); break;

      case 'start': startPaper(el.dataset.id, el.dataset.mock === '1'); break;

      case 'delPaper': {
        const p = papers.find(x => x.id === el.dataset.id);
        if (!p) break;
        ask('删除资料', '确定删除「' + p.label + '」吗？这个操作不可恢复。', '删除', () => {
          papers = papers.filter(x => x.id !== p.id);
          store.set('plsc_papers', papers);
          view = 'library'; render();
          toast('已删除：' + p.label);
        });
        break;
      }

      case 'editAnswers': editAnswersDialog(el.dataset.id); break;

      case 'saveAnswers': saveAnswersFromDialog(el.dataset.id); break;

      case 'savePaper': savePaper(); break;

      case 'showAnsCount': {
        const r = ansCountFromUI();
        const pre = $('#mAnsPreview');
        if (pre) pre.textContent = '已识别 ' + r.applied + ' 个答案，共 ' + r.total + ' 题' + (r.missing && r.missing.length ? '；仍缺：' + r.missing.join('、') : '；已齐');
        break;
      }

      case 'tab': session.tab = +el.dataset.i; render(true); break;

      case 'blankRow':
      case 'blank':
        if (session && !session.submitted) { session.active = +el.dataset.no; render(true); }
        break;

      case 'bank': {
        if (!session || session.submitted) break;
        const k = el.dataset.k;
        const usedBy = Object.keys(session.answers).find(no => session.answers[no] === k && session.qmap[no] && session.qmap[no].type === 'cloze');
        if (session.active == null) { toast('请先点一个题号或文中的空'); break; }
        if (usedBy) delete session.answers[usedBy];
        session.answers[session.active] = k;
        const cur = session.qmap[session.active];
        const sec = session.paper.sections[session.tab];
        if (sec && sec.type === 'cloze') {
          const qs = sec.blocks[0].questions;
          const i = qs.findIndex(q => q.no === session.active);
          if (i >= 0 && i + 1 < qs.length) session.active = qs[i + 1].no;
        }
        render(true);
        break;
      }

      case 'pick': {
        if (!session || session.submitted) break;
        session.answers[+el.dataset.no] = el.dataset.k;
        render(true);
        break;
      }

      case 'jump': jumpToAnswer(+el.dataset.no); break;

      case 'submit': {
        if (!session) break;
        const all = allQuestions(session.paper);
        const done = all.filter(q => session.answers[q.no]).length;
        const doSubmit = () => {
          session.submitted = true;
          clearInterval(timerHandle);
          if (!session.historySaved) { saveHistoryEntry(); session.historySaved = true; }
          render(); window.scrollTo(0, 0);
        };
        if (done < all.length) ask('还有未作答的题', `已答 ${done} / ${all.length} 题，确定提交吗？`, '提交', doSubmit);
        else doSubmit();
        break;
      }

      case 'redo': if (session) { const id = session.paper.id; session = null; startPaper(id, false); } break;

      case 'quitTest': {
        if (session && !session.submitted && !confirm('退出后本次作答不会保存，确定吗？')) break;
        clearInterval(timerHandle); session = null; view = 'library'; render();
        break;
      }

      case 'word': toggleWord(el.dataset.w, el.dataset.s); break;

      case 'delWord': {
        const w = el.dataset.w;
        vocab = vocab.filter(v => v.w !== w);
        saveVocab(); render(true);
        toast('已移出生词本：' + w);
        break;
      }

      case 'toggleMastered': {
        const v = vocab.find(x => x.w === el.dataset.w);
        if (!v) break;
        v.mastered = !v.mastered;
        saveVocab(); render(true);
        toast(v.mastered ? '已标记为掌握（不再复习）' : '已取消掌握');
        break;
      }

      case 'startReview': startReview(); break;

      case 'reviewSubmit': {
        if (!session || !session.review) break;
        const v = session.reviewList[session.reviewIndex];
        const inp = $('#reviewInput');
        const val = (inp ? inp.value : '').trim();
        if (!val) { toast('请先输入单词'); break; }
        session.reviewInput = val;
        session.resultFlash = (val.toLowerCase() === String(v.w).toLowerCase()) ? 'ok' : 'no';
        session.stage = 'done';
        clearInterval(reviewTimerHandle);
        render();
        const i2 = $('#reviewInput');
        if (i2) i2.focus();
        break;
      }

      case 'reviewSkip': {
        if (!session || !session.review) break;
        session.stage = 'done';
        session.resultFlash = 'no';
        clearInterval(reviewTimerHandle);
        render();
        break;
      }

      case 'rate': {
        if (!session || !session.review) break;
        const v = session.reviewList[session.reviewIndex];
        updateVocabAfterReview(v, el.dataset.rate);
        saveVocab();
        session.reviewIndex++;
        session.stage = 'input';
        session.reviewInput = '';
        session.resultFlash = null;
        session.reviewStartAt = Date.now();
        render(); window.scrollTo(0, 0);
        if (session.reviewIndex < session.reviewList.length) startReviewTimer();
        else toast('本轮复习完成');
        break;
      }

      case 'clearHistory':
        ask('清空记录', '确定清空所有学习记录吗？生词本和资料不受影响。', '清空', () => {
          history = []; saveHistory(); render(); toast('已清空学习记录');
        });
        break;

      case 'saveSettings': saveSettingsFromUI(); break;

      case 'resetSettings':
        ask('恢复默认设置', '所有可调参数会恢复为默认值。', '恢复', () => {
          settings = Object.assign({}, DEFAULT_SETTINGS);
          saveSettings(); render(); toast('已恢复默认设置');
        });
        break;

      case 'exportAll': exportAll(); break;
      case 'exportVocab': exportVocab(); break;

      case 'wipeAll':
        ask('清空所有数据', '资料、生词、记录、设置会全部删除，且不可恢复。建议先导出备份。', '确认清空', () => {
          ['plsc_papers', 'plsc_vocab', 'plsc_history', 'plsc_settings'].forEach(k => store.remove(k));
          papers = []; vocab = []; history = []; settings = Object.assign({}, DEFAULT_SETTINGS);
          view = 'home'; viewId = null; render(); toast('已清空所有数据');
        });
        break;
    }
  }
}

/* ===================== 其它事件 ===================== */
function bindInputEvents() {
  // 输入类
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'vq') {
      vocabQuery = el.value;
      const pos = el.selectionStart;
      render(true);
      const n = $('#vq');
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
    } else if (el.id === 'vlang') {
      reviewLangFilter = el.value; render(true);
    } else if (el.dataset && el.dataset.act === 'editMeaning') {
      const v = vocab.find(x => x.w === el.dataset.w);
      if (v) { v.meaning = el.value; store.set('plsc_vocab', vocab); }
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'vlang') { reviewLangFilter = e.target.value; render(true); }
  });

  // 键盘
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target && e.target.id === 'reviewInput') {
      if (session && session.review && session.stage === 'input') {
        e.preventDefault();
        const btn = $('[data-act="reviewSubmit"]');
        if (btn) btn.click();
      }
    } else if (e.target && e.target.id === 'mAns' && e.ctrlKey) {
      e.preventDefault();
      savePaper();
    }
  });

  // 文件选择
  /* 关键：必须先把 files 复制成普通数组，再清空 input.value。
     否则清空 input 会把 files 一起清掉，异步处理时就读不到文件了（看起来"点了没反应"）。 */
  const fileEl = $('#file');
  if (fileEl) fileEl.addEventListener('change', e => {
    const picked = e.target.files ? Array.from(e.target.files) : [];
    if (window.__bootLog) window.__bootLog.push('files:' + picked.length);
    bootDiag('📂 文件框已变化，选中 ' + picked.length + ' 个：' + (picked.map(f => f.name).join('、') || '（空——可能没点「打开」）'), picked.length === 0);
    e.target.value = '';
    if (picked.length) handleFiles(picked);
  });
  const ansEl = $('#ansFile');
  if (ansEl) ansEl.addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f || !pending) return;
    try {
      const { text } = await readAnyFile(f);
      const ta = $('#mAns');
      if (!ta) return;
      const merged = (ta.value ? ta.value + '\n' : '') + text;
      ta.value = merged;
      const r = ansCountFromUI();
      const pre = $('#mAnsPreview');
      if (pre) pre.textContent = '已识别 ' + r.applied + ' 个答案，共 ' + r.total + ' 题' + (r.missing && r.missing.length ? '；仍缺：' + r.missing.join('、') : '；已齐');
      toast('已读入答案文件，识别到 ' + r.applied + ' 个答案');
    } catch (err) { toast('答案文件读取失败：' + (err.message || err)); }
  });
  const bkEl = $('#backupFile');
  if (bkEl) bkEl.addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) importBackup(f);
  });
}

/* ===================== 对话框：粘贴文字 / 修改答案 ===================== */
function pasteTextDialog() {
  modal(`<div class="dlg">
    <h3>粘贴文字</h3>
    <p class="muted">把真题的阅读部分（选词填空 / 长篇阅读 / 仔细阅读）粘贴进来，程序会自动识别 26-55 题。</p>
    <textarea id="pText" style="min-height:200px" placeholder="在此粘贴文本…"></textarea>
    <div class="row" style="margin-top:10px">
      <label>文件名（可选）<input type="text" id="pName" placeholder="CET-6 2026年6月 第1套"></label>
    </div>
    <div class="btns">
      <button class="ghost" data-act="close">取消</button>
      <button class="primary" data-act="doPaste">解析</button>
    </div>
  </div>`);
  const btn = $('[data-act="doPaste"]');
  if (btn) btn.onclick = () => {
    const t = ($('#pText') || {}).value || '';
    const name = (($('#pName') || {}).value || '').trim() || '粘贴的文字';
    if (!t.trim()) { toast('请先粘贴文字'); return; }
    closeModal();
    openPreview(name, t, false, contentHash(t));
  };
}

function editAnswersDialog(id) {
  const p = papers.find(x => x.id === id);
  if (!p) return;
  const qs = allQuestions(p);
  const cur = qs.filter(q => q.ans).map(q => q.no + q.ans).join(' ');
  modal(`<div class="dlg">
    <h3>补充 / 修改答案</h3>
    <p class="muted">${esc(p.label)} · 共 ${qs.length} 题，已有 ${countAnswered(p)} 题答案。</p>
    <p class="muted">当前答案：<code>${esc(cur || '（无）')}</code></p>
    <textarea id="eAns" placeholder="${esc(ANS_HINT)}"></textarea>
    <p class="muted">只填要修改的题号即可，例如只写 <code>51C 52A</code>，其余保持不变。留空则清空这些题。</p>
    <div class="btns">
      <button class="ghost" data-act="close">取消</button>
      <button class="primary" data-act="saveAnswers" data-id="${esc(id)}">保存答案</button>
    </div>
  </div>`);
}

function saveAnswersFromDialog(id) {
  const p = papers.find(x => x.id === id);
  if (!p) return;
  const av = (($('#eAns') || {}).value || '').trim();
  const qs = allQuestions(p);
  if (av) {
    const pairs = parseAnswerPairs(norm(av).toUpperCase());
    let n = 0;
    qs.forEach(q => { if (pairs[q.no]) { q.ans = pairs[q.no]; n++; } });
    const unmatched = Object.keys(pairs).map(Number).filter(no => !qs.some(q => q.no === no));
    store.set('plsc_papers', papers);
    closeModal();
    render();
    toast('已更新 ' + n + ' 个答案' + (unmatched.length ? '（题号 ' + unmatched.join('、') + ' 在卷子里没有对应题目）' : ''));
  } else {
    closeModal();
  }
}

function saveSettingsFromUI() {
  const num = (id, d) => {
    const v = parseInt((($('#' + id) || {}).value || '').trim(), 10);
    return isNaN(v) ? d : v;
  };
  const iv = (($('#sIntervals') || {}).value || '').trim();
  settings.dailyNew = clamp(num('sDailyNew', DEFAULT_SETTINGS.dailyNew), 1, 999);
  settings.dailyReview = clamp(num('sDailyReview', DEFAULT_SETTINGS.dailyReview), 1, 999);
  settings.recognizeSeconds = clamp(num('sRecognize', DEFAULT_SETTINGS.recognizeSeconds), 1, 600);
  settings.autoPauseSeconds = clamp(num('sAutoPause', DEFAULT_SETTINGS.autoPauseSeconds), 5, 3600);
  if (iv) settings.intervals = iv.split(',').map(s => parseInt(s.trim(), 10)).filter(n => n > 0).join(',') || DEFAULT_SETTINGS.intervals;
  saveSettings();
  render();
  toast('设置已保存');
}

/* ===================== 启动 ===================== */
/* v2 自检：在页面底部留一行可见的状态标记，便于确认脚本是否真的跑起来了 */
function bootDiag(message, isError) {
  let d = $('#bootstate');
  if (!d) return;
  d.style.display = 'block';
  d.textContent = message;
  d.style.background = isError ? '#d1344a' : '#e8f5ee';
  d.style.color = isError ? '#fff' : '#1b8a5a';
}

function boot() {
  const steps = [];
  try {
    steps.push('start');
    (window.__bootLog = window.__bootLog || []).push('boot:start');
    loadAll();
    steps.push('loaded');
    vocabSet = new Set(vocab.map(v => v.w));
    bindEvents();
    bindInputEvents();
    steps.push('bound');
    startVisibilityWatcher();
    render();
    steps.push('rendered');

    const appEl = $('#app');
    if (!appEl || !appEl.innerHTML || appEl.innerHTML.length < 20) {
      bootDiag('启动异常：页面内容没有渲染出来。请把下面这行发给开发者 → ' + steps.join('>'), true);
      return;
    }
    const navEl = document.getElementById('nav');
    const navOk = !!(navEl && navEl.querySelectorAll('button').length >= 5);
    bootDiag('✅ 程序已就绪（v7）：导航 5 个按钮' + (navOk ? '正常' : '异常') +
      '，资料 ' + papers.length + ' 套，生词 ' + vocab.length + ' 个。点「资料库」试试。', false);
    if (!store.diskOK) setTimeout(showStorageWarn, 300);
  } catch (e) {
    bootDiag('启动失败（已走完 ' + steps.join('>') + '）：' + (e && e.message ? e.message : e), true);
    throw e;
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* 对外暴露少量内部方法，便于自检与排查（不影响正常使用） */
window.__plsc = {
  parsePaper, parseAnswerPairs, extractAnswers, norm, applyAnswers, lemmatize,
  get papers() { return papers; }, set papers(v) { papers = v; },
  get vocab() { return vocab; }, set vocab(v) { vocab = v; },
  get history() { return history; }, set history(v) { history = v; },
  get settings() { return settings; }, set settings(v) { settings = v; },
  get view() { return view; }, set view(v) { view = v; },
  get viewId() { return viewId; }, set viewId(v) { viewId = v; },
  get pending() { return pending; }, set pending(v) { pending = v; },
  get session() { return session; }, set session(v) { session = v; },
  get queue() { return queue; }, set queue(v) { queue = v; },
  render, openPreview, startPaper, calc, savePaper, exportAll, buildTree,
  setTab(i) { if (session) session.tab = i; },
  countQuestions, countAnswered, allQuestions, DEFAULT_SETTINGS
};

})();
</script>
