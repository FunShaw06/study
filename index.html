<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人语言学习中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#eaeef5;--paper:#ffffff;--ink:#14213d;--mut:#667089;--line:#d3dae7;
  --blue:#2a4bd7;--blue-s:#e3e9fc;--ok:#1b8a5a;--ok-s:#dcf3e8;--no:#d1344a;--no-s:#fbe3e7;
  --warn:#d97706;--warn-s:#fef3c7;--hl:#ffe45c;
  --ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Iowan Old Style","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--ink);color:#fff;gap:8px}
.brand{font:700 17px var(--serif);letter-spacing:.03em;display:flex;flex-direction:column;line-height:1.15}
.brand small{font:400 11px var(--ui);opacity:.6;letter-spacing:.05em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;border-radius:8px;color:#fff;padding:6px 9px;font-size:13px}
nav button.on{background:#fff;color:var(--ink)}
#vc:not(:empty){margin-left:4px;background:var(--hl);color:var(--ink);border-radius:10px;padding:0 5px;font-size:11px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:16px 14px 110px}
h2{font:700 19px var(--serif);margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3{font:700 15px var(--serif);margin:16px 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1;min-width:120px}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{min-height:100px;resize:vertical}
.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 18px}
.danger{background:#fff;border:1px solid var(--no);color:var(--no);border-radius:10px;padding:10px 18px}
.link{background:none;border:0;color:var(--blue);padding:4px 0;font-weight:600;font-size:14px}
.muted{color:var(--mut);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center}
.drop p{margin:6px 0 12px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--blue);font-weight:600}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-s);border:1px solid var(--warn);color:#92400e}
.notice.info{background:var(--blue-s);border:1px solid var(--blue);color:#1e3a8a}
.notice.no{background:var(--no-s);border:1px solid var(--no);color:#7f1d1d}
.notice button{background:none;border:0;color:inherit;font-weight:600;padding:0 4px;flex:none}
.notice .body{flex:1}
.tree{margin-top:4px}
.tree-lang{margin-bottom:14px}
.tree-lang>.tl{font:700 15px var(--ui);margin-bottom:6px;letter-spacing:.02em}
.tree-exam{margin-left:12px;margin-bottom:8px}
.tree-exam>.te{font:600 13px var(--ui);color:var(--mut);margin-bottom:4px}
.tree-items{display:flex;flex-wrap:wrap;gap:6px;margin-left:10px}
.ti{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-align:left;font-size:13px;font-weight:600}
.ti i{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--mut)}
.ti:hover{border-color:var(--blue);color:var(--blue)}
.ti.miss{border-color:var(--warn);background:var(--warn-s)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0 4px}
.meta-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.meta-item span{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.sec-list{list-style:none;padding:0;margin:8px 0 12px}
.sec-list li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sec-list li:last-child{border-bottom:0}
.recent{list-style:none;padding:0;margin:0}
.recent li{padding:10px 0;border-bottom:1px solid var(--line)}
.recent li:last-child{border-bottom:0}
.rt{font-weight:600}
.rm{font-size:12px;color:var(--mut);margin-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut)}
.stat b{display:block;font:700 20px var(--serif);color:var(--ink);margin-top:2px}
.stat.ok b{color:var(--ok)}
.stat.no b{color:var(--no)}
.stat.warn b{color:var(--warn)}
.vlist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr;gap:8px}
.vlist li{display:flex;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;gap:8px}
.vbody{flex:1;min-width:0}
.vw{font:700 18px var(--serif)}
.vsen{font:14px/1.6 var(--serif);color:#3a4460;margin:4px 0;word-break:break-word}
.vsrc{font-size:11px;color:var(--mut)}
.vlist .x{border:0;background:var(--no-s);color:var(--no);width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;flex:none}
.vocab-meaning{width:100%;margin-top:6px;padding:7px 9px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff}
.vocab-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.vocab-actions button{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--mut)}
.vocab-actions button.mastered{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
.review-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.review-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.review-word{font:700 26px var(--serif);margin:0}
.review-timer{font-size:13px;color:var(--mut)}
.review-timer.warn{color:var(--warn);font-weight:600}
.review-timer.over{color:var(--no);font-weight:600}
.review-meaning{font-size:14px;color:var(--ink);padding:8px 0 12px;border-bottom:1px dashed var(--line);margin-bottom:12px;min-height:22px}
.review-meaning.empty-m{color:var(--mut);font-style:italic;font-size:13px}
.review-blank{font:17px/1.85 var(--serif);padding:12px;background:#f7f8fb;border-radius:10px}
.review-blank u{color:var(--blue);text-decoration:none;border-bottom:2px solid var(--blue);padding:0 30px;letter-spacing:2px;font-weight:600}
.review-input{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:10px;margin-top:12px;font-family:var(--serif);text-align:center;letter-spacing:1px}
.review-input:focus{border-color:var(--blue)}
.review-input.ok{border-color:var(--ok);background:var(--ok-s)}
.review-input.no{border-color:var(--no);background:var(--no-s)}
.review-answer{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px}
.review-answer.ok{background:var(--ok-s);color:var(--ok);font-weight:600}
.review-answer.no{background:var(--no-s);color:var(--no);font-weight:600}
.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.review-actions button{flex:1;min-width:70px}
.review-actions button.rec{border:2px solid var(--blue);background:var(--blue-s);color:var(--blue);font-weight:600}
.history{width:100%;border-collapse:collapse;font-size:13px}
.history th,.history td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mini{font-size:12px;color:var(--mut)}
.chart-wrap{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfe;margin:8px 0}
.chart-title{font-weight:600;font-size:14px;margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto}
.bars{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bar-row{font-size:13px}
.bar-row .bl{display:flex;justify-content:space-between;margin-bottom:3px}
.bar-track{background:#eef1f7;border-radius:6px;overflow:hidden;height:10px}
.bar-fill{height:100%;background:var(--blue);border-radius:6px}
.bar-fill.warn{background:var(--warn)}
.bar-fill.no{background:var(--no)}
.plan-list{list-style:none;padding:0;margin:8px 0}
.plan-list li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfe}
.plan-list li b{display:block;margin-bottom:3px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row>div{flex:1}
.setting-row .lbl{font-weight:600;font-size:14px}
.setting-row .desc{font-size:12px;color:var(--mut);margin-top:2px}
.setting-row input[type=number],.setting-row input[type=text]{width:100px;flex:none;text-align:right;font-size:15px;padding:7px 10px}
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tbar b{font:700 17px var(--serif)}
.timer{font:700 22px var(--serif);letter-spacing:.04em;margin-left:auto}
.timer.warn{color:var(--no)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{flex:1;min-width:112px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left}
.tab i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on i{color:#c4cbe0}
.cols{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.passage{font:17px/1.85 var(--serif)}
.passage p{margin:0 0 .9em;max-width:70ch}
.pm{display:inline-block;min-width:1.6em;margin-right:.4em;padding:0 .35em;border-radius:6px;background:var(--ink);color:#fff;font:700 14px var(--ui);text-align:center}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--blue-s)}
.w.saved{background:var(--hl)}
.blank{display:inline-block;min-width:5.4em;text-align:center;border-bottom:2px solid var(--ink);margin:0 .15em;padding:0 .3em;cursor:pointer;font-family:var(--ui);font-size:15px;line-height:1.5}
.blank sup{font-size:11px;font-weight:700;margin-right:3px;color:var(--blue)}
.blank.act{background:var(--blue-s);border-color:var(--blue)}
.blank.ok{background:var(--ok-s);border-color:var(--ok)}
.blank.no{background:var(--no-s);border-color:var(--no)}
.blank.hl{animation:flash 1.6s ease}
@keyframes flash{0%,100%{background:transparent}30%,60%{background:var(--hl)}}
.hint{margin:0 0 10px;color:var(--mut);font-size:13px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;position:sticky;top:56px;background:var(--paper);padding:6px 0;z-index:5}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px 4px 5px}
.pill b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-size:12px}
.pill.used{opacity:.4}
.brow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.brow .n{font-weight:700;width:28px}
.brow .val{flex:1}
.brow.act{border-color:var(--blue);background:var(--blue-s)}
.brow.ok{border-color:var(--ok);background:var(--ok-s)}
.brow.no{border-color:var(--no);background:var(--no-s)}
.fix{color:var(--ok);font-weight:600;font-size:13px}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.stem{margin-bottom:8px}
.stem .n{display:inline-block;min-width:26px;font-weight:700;color:var(--blue)}
.jump-btn{font-size:12px;padding:2px 10px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--blue);margin-left:8px;font-weight:600;vertical-align:middle}
.jump-btn:hover{background:var(--blue-s);border-color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bub,.opt b,.lt{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);font-size:13px;font-weight:700;background:#fff}
.opt.sel,.lt.sel{border-color:var(--ink)}
.opt.sel b,.lt.sel{background:var(--ink);color:#fff}
.opt.right{background:var(--ok-s);border-color:var(--ok)}
.opt.right b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--no-s);border-color:var(--no)}
.opt.wrong b{background:var(--no);border-color:var(--no);color:#fff}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.lt{width:34px;height:34px;padding:0}
.lt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.lt.wrong{background:var(--no);border-color:var(--no);color:#fff}
.status{margin-top:8px;font-size:13px;font-weight:600}
.status.ok{color:var(--ok)}.status.no{color:var(--no)}.status.na{color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result{border:2px solid var(--ink)}
.big{font:700 44px/1.1 var(--serif)}
.big small{font-size:18px;color:var(--mut);font-weight:400;margin-left:4px}
.per{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.per div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.per b{display:block;font-size:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{display:none;position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:50;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex}
.dlg{background:#fff;border-radius:14px;padding:18px;max-width:620px;width:100%;max-height:88vh;overflow:auto}
.dlg h3{font:700 19px var(--serif);margin:0 0 10px}
.sum{margin:10px 0;padding-left:18px}
.warn{color:var(--no);font-size:13px;margin:6px 0}
.ans-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ans-btns button{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue)}
pre{white-space:pre-wrap;font-size:12px;background:#f4f6fa;padding:10px;border-radius:8px;max-height:220px;overflow:auto}
@media(min-width:900px){
  .cols{grid-template-columns:1.2fr 1fr;align-items:start}
  .pane{max-height:calc(100vh - 200px);overflow:auto}
  .vlist{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.blank.hl{animation:none}}
</style>
</head>
<body>
<div id="__err" style="display:none;position:fixed;top:0;left:0;right:0;background:#d1344a;color:#fff;padding:12px;z-index:9999;font-size:13px;word-break:break-all;max-height:60vh;overflow:auto"></div>
<script>window.addEventListener('error',function(e){var d=document.getElementById('__err');if(d){d.style.display='block';d.textContent='JS错误: '+(e.message||'?')+' | 行 '+(e.lineno||'?')+':'+(e.colno||'?');}});</script>
<header class="top">
  <div class="brand">语言学习中心<small>Personal Language Study Center</small></div>
  <nav>
    <button data-act="nav" data-view="home">首页</button>
    <button data-act="nav" data-view="library">资料库</button>
    <button data-act="nav" data-view="vocab">生词<span id="vc"></span></button>
    <button data-act="nav" data-view="history">记录</button>
    <button data-act="nav" data-view="settings">设置</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<div id="modal"></div>
<input type="file" id="file" accept=".docx,.pdf,.txt" multiple hidden>
<input type="file" id="importFile" accept=".json" hidden>
<input type="file" id="ansFile" accept=".docx,.pdf,.txt" hidden>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clean=s=>s.replace(/\s+/g,' ').trim();

/* ---------- 本地存储 + 用量监控 ---------- */
const store={
  mem:{},
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in this.mem?this.mem[k]:d}},
  set(k,v){
    const s=JSON.stringify(v);
    try{localStorage.setItem(k,s);}
    catch(e){
      this.mem[k]=v;
      setTimeout(()=>{const el=document.getElementById('storage-warn');if(el)el.style.display='flex';},0);
    }
    this.checkSize();
  },
  checkSize(){
    let total=0;
    for(let k in localStorage){if(k.indexOf('plsc_')===0){total+=(localStorage[k]||'').length;}}
    const kb=total/1024;
    const el=document.getElementById('storage-warn');
    if(!el)return;
    if(kb>3000){
      el.style.display='flex';
      const t=el.querySelector('.stor-text');
      if(t)t.textContent='本地存储已用 '+Math.round(kb)+'KB，接近浏览器上限（约 5MB）。建议导出备份，并删除一些旧资料。';
    }
  }
};

/* ---------- 默认设置 ---------- */
const DEFAULT_SETTINGS={
  dailyNew:10,
  dailyReview:50,
  recognizeSeconds:10,
  intervals:'1,2,4,7,15,30',
  autoPauseSeconds:60,
  warnMissingAnswers:true,
  duplicateCheck:true
};
let settings=Object.assign({},DEFAULT_SETTINGS,store.get('plsc_settings',{}));
function saveSettings(){store.set('plsc_settings',settings);}

/* ---------- 数据加载 ---------- */
let papers=store.get('plsc_papers',[]);
let vocab=store.get('plsc_vocab',[]);
let history=store.get('plsc_history',[]);
let vocabSet=new Set(vocab.map(v=>v.w));
/* 清理旧版错题数据 */
try{
  if(localStorage.getItem('plsc_wrongs'))localStorage.removeItem('plsc_wrongs');
  if(localStorage.getItem('plsc_reasons'))localStorage.removeItem('plsc_reasons');
}catch(e){}

/* ---------- 全局状态 ---------- */
let view='home',session=null,pending=null,okCb=null,detailId=null;
let timerHandle=null;
let sessionStart=0;
let sessionAccum=0;
let sessionPaused=false;
let queue=[];
let vocabQuery='';
let reviewLangFilter='';
let storageWarnShown=store.get('plsc_storage_warned',false);
let firstVisit=!store.get('plsc_seen_local_notice',false);

/* ---------- 词形还原 ---------- */
const IRREGULAR={
  went:'go',gone:'go',goes:'go',am:'be',is:'be',are:'be',was:'be',were:'be',been:'be',being:'be',
  had:'have',has:'have',having:'have',
  did:'do',does:'do',done:'do',doing:'do',
  said:'say',says:'say',saying:'say',
  got:'get',gotten:'get',gets:'get',getting:'get',
  made:'make',makes:'make',making:'make',
  knew:'know',known:'know',knows:'know',knowing:'know',
  thought:'think',thinks:'think',thinking:'think',
  took:'take',taken:'take',takes:'take',taking:'take',
  saw:'see',seen:'see',sees:'see',seeing:'see',
  came:'come',comes:'come',coming:'come',
  gave:'give',given:'give',gives:'give',giving:'give',

}

/* ---------- 切片 ---------- */

/* ---------- 智能识别 ---------- */
function detectLanguage(text,name){
  const s=name+'\n'+text.slice(0,4000);
  const kana=(s.match(/[\u3040-\u309f\u30a0-\u30ff]/g)||[]).length;
  const han=(s.match(/[\u4e00-\u9fff]/g)||[]).length;
  const lat=(s.match(/[A-Za-z]/g)||[]).length;
  const total=kana+han+lat;

  if(kana/total>0.03)return '日语';

    const fr=(s.match(/[àâçéèêëîïôùûüÿœæ]/gi)||[]).length;
    if(fr>20&&fr/lat>0.005)return '法语';

}
function detectExam(text,name){

function buildLabel(meta,name){
  const base=(name||'未命名资料').replace(/\.[a-z0-9]+$/i,'').trim();
  const parts=[];
  if(meta.exam)parts.push(meta.exam+(meta.level?' '+meta.level:''));
  else if(meta.level)parts.push(meta.level);
  if(meta.year)parts.push(meta.year+'年'+(meta.month?meta.month+'月':''));
  if(meta.set)parts.push('第'+meta.set+'套');
  if(!meta.year&&!meta.set&&base)return base;
  return parts.filter(Boolean).join(' ')||base;
}

/* ---------- 内容 hash（用于去重） ---------- */
function contentHash(text){
  const s=norm(text);
  const head=s.slice(0,2000);
  let h=0;
  for(let i=0;i<head.length;i++){h=((h<<5)-h+head.charCodeAt(i))|0;}
  return h.toString(36)+'_'+s.length;
}

/* ---------- 读文件 ---------- */
async function pdfToText(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const rows=[];
    tc.items.forEach(it=>{
      if(!it.str)return;
      const y=it.transform[5],x=it.transform[4];
      let row=rows.find(r=>Math.abs(r.y-y)<3);
      if(!row){row={y,items:[]};rows.push(row);}
      row.items.push({x,w:it.width,s:it.str});
    });
    rows.sort((a,b)=>b.y-a.y);
    rows.forEach(r=>{
      r.items.sort((a,b)=>a.x-b.x);
      let line='',end=null;
      r.items.forEach(it=>{
        if(end!==null&&it.x-end>1&&!line.endsWith(' ')&&!it.s.startsWith(' '))line+=' ';
        line+=it.s;end=it.x+it.w;
      });
      out.push(line);
    });
  }
  return out.join('\n');
}
async function readAnyFile(file){
  const name=file.name,ext=name.split('.').pop().toLowerCase();
  let text,isPdf=false;
  if(ext==='docx'){
    if(typeof mammoth==='undefined')throw new Error('Word 组件未加载，请联网后刷新');
    text=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;
  }else if(ext==='pdf'){
    if(typeof pdfjsLib==='undefined')throw new Error('PDF 组件未加载，请联网后刷新');
    isPdf=true;text=await pdfToText(file);
  }else if(ext==='txt'){
    text=await file.text();
  }else{
    throw new Error('只支持 .docx / .pdf / .txt');
  }
  if(!text||text.trim().length<200)throw new Error('没读到文字（扫描版 PDF 暂不支持）');
  return {text,isPdf,name};
}
async function handleFile(file){
  try{
    const {text,isPdf,name}=await readAnyFile(file);
    const hash=contentHash(text);
    if(settings.duplicateCheck){
      const exist=papers.find(p=>p.hash===hash);
      if(exist){toast('已存在同内容资料：'+exist.label);return;}
    }
    openPreview(name,text,isPdf,hash);
  }catch(e){toast('解析失败：'+(e.message||e));}
}

function sentenceOf(text,start,end){
  const left=text.lastIndexOf('.',start-1);
  const q=text.lastIndexOf('?',start-1);
  const ex=text.lastIndexOf('!',start-1);
  const semi=Math.max(left,q,ex);
  let a=semi<0?0:semi+1;
  let b=text.indexOf('.',end);
  const qb=text.indexOf('?',end),eb=text.indexOf('!',end);
  [qb,eb].forEach(x=>{if(x>=0&&(b<0||x<b))b=x;});
  if(b<0)b=text.length;
  return clean(text.slice(a,b+1));
}
function rich(text){
  const re=/⟦(\d+)⟧|([A-Za-z]+(?:['\-][A-Za-z]+)*)/g;
  let out='',last=0,m;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    if(m[1])out+=blankHTML(+m[1]);
    else if(m[2].length>1){
      const lemma=lemmatize(m[2]);
      const sentence=sentenceOf(text,m.index,re.lastIndex);
      out+=`<span class="w${vocabSet.has(lemma)?' saved':''}" data-w="${esc(lemma)}" data-raw="${esc(m[2])}" data-sentence="${esc(sentence)}">${esc(m[2])}</span>`;
    }else out+=esc(m[2]);
    last=re.lastIndex;
  }
  return out+esc(text.slice(last));
}
function blankHTML(no){
  const s=session,q=s.qmap[no],a=s.answers[no];
  const word=a&&q?(q.opts.find(o=>o.k===a)||{}).t:'';
  let cls='blank';
  if(s.submitted)cls+=(q&&a===q.ans)?' ok':' no';
  else if(s.active===no)cls+=' act';
  return `<span class="${cls}" id="blank-${no}" data-act="blank" data-no="${no}"><sup>${no}</sup>${word?esc(word):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`;
}

/* ---------- 时间 ---------- */
function fmtDate(ts){
  return ts?new Date(ts).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}):'—';
}
function fmtRelTime(ts){
  const d=Date.now()-ts;
  const min=Math.floor(d/60000);
  if(min<1)return '刚刚';
  if(min<60)return min+' 分钟前';
  const h=Math.floor(min/60);
  if(h<24)return h+' 小时前';
  const day=Math.floor(h/24);
  if(day<7)return day+' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function fmtDuration(sec){
  sec=Math.max(0,Math.round(sec||0));
  if(sec<60)return sec+' 秒';
  const m=Math.round(sec/60);
  if(m<60)return m+' 分钟';
  return Math.floor(m/60)+' 小时 '+(m%60)+' 分';
}
function fmtTimer(sec){
  sec=Math.max(0,sec|0);
  return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}

const ANS_HINT='格式随意，例如 26-30 BDACE 或 26B 27D…；可以分多行；也可以只写字母，按题号顺序依次对应。';
function applyAnswers(paper,text){
  const qs=paper.sections.flatMap(se=>se.blocks.flatMap(b=>b.questions));
  const t=norm(text).toUpperCase();
  let pairs={};
  if(!/\d/.test(t)){
    const ls=t.replace(/[^A-O]/g,'').split('');
    qs.forEach((q,i)=>{if(ls[i])pairs[q.no]=ls[i];});
  }else pairs=parseAnswerPairs(t);
  qs.forEach(q=>{if(pairs[q.no])q.ans=pairs[q.no];});
  return qs.filter(q=>q.ans).length+' / '+qs.length;
}

  const paper={id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),...meta,label,sections:pending.r.sections,created:Date.now(),hash:pending.hash};
  const av=($('#mAns')||{}).value;

  /* ---------- 做题 ---------- */
function startPaper(id,mock){
  const paper=papers.find(p=>p.id===id);if(!paper)return;
  clearInterval(timerHandle);
  const qmap={};
  paper.sections.forEach(sec=>sec.blocks.forEach(b=>b.questions.forEach(q=>{q.type=sec.type;qmap[q.no]=q;})));
  const fc=paper.sections.find(s=>s.type==='cloze');
  session={paper,answers:{},submitted:false,tab:0,qmap,active:fc?fc.blocks[0].questions[0].no:null,mock:!!mock,timeLeft:mock?2400:null,historySaved:false};
  sessionStart=Date.now();sessionAccum=0;sessionPaused=false;
  view='test';render();
  if(mock)startTimer();
  startVisibilityWatcher();
}
function startTimer(){
  clearInterval(timerHandle);
  timerHandle=setInterval(()=>{
    if(!session||!session.mock||session.submitted){clearInterval(timerHandle);return;}
    if(sessionPaused)return;
    session.timeLeft--;
    const el=$('#countdown');
    if(el){el.textContent=fmtTimer(session.timeLeft);el.classList.toggle('warn',session.timeLeft<=300);}
    if(session.timeLeft<=0){
      clearInterval(timerHandle);
      toast('40 分钟到，正在自动交卷…');
      session.submitted=true;
      if(!session.historySaved){saveHistory();session.historySaved=true;}
      render();
    }
  },1000);
}
/* 页面可见性 + 无操作自动暂停 */
let lastActivity=Date.now();
function startVisibilityWatcher(){
  if(startVisibilityWatcher.done)return;
  startVisibilityWatcher.done=true;
  ['mousemove','keydown','click','touchstart','scroll'].forEach(ev=>{
    document.addEventListener(ev,()=>{lastActivity=Date.now();},true);
  });
  document.addEventListener('visibilitychange',()=>{updatePause();});
  setInterval(updatePause,5000);
  window.addEventListener('beforeunload',()=>{if(session&&!session.submitted)commitAccum();});
}
function updatePause(){
  if(!session||session.submitted)return;
  const hidden=document.hidden;
  const idle=(Date.now()-lastActivity)>settings.autoPauseSeconds*1000;
  const should=hidden||idle;
  if(should&&!sessionPaused){commitAccum();sessionPaused=true;}
  else if(!should&&sessionPaused){sessionPaused=false;sessionStart=Date.now();}
}
function commitAccum(){
  if(sessionStart){sessionAccum+=(Date.now()-sessionStart);sessionStart=Date.now();}
}
function currentSessionDuration(){
  return sessionAccum+(sessionStart?Date.now()-sessionStart:0);
}

/* ---------- 选词填空 UI ---------- */
function clozeHTML(b){
  const s=session,used={};
  Object.entries(s.answers).forEach(([n,k])=>{if(s.qmap[n]&&s.qmap[n].type==='cloze')used[k]=n;});
  const pills=b.bank.map(o=>`<button class="pill${used[o.k]?' used':''}" data-act="bank" data-k="${o.k}"><b>${o.k}</b>${esc(o.t)}</button>`).join('');
  const rows=b.questions.map(q=>{
    const a=s.answers[q.no],word=a?(q.opts.find(o=>o.k===a)||{}).t:'';
    let cls='brow',extra='';
    if(s.submitted){
      const ok=a===q.ans;cls+=ok?' ok':' no';
      if(!ok)extra=`<span class="fix">${q.ans?'正确：'+q.ans+') '+esc((q.opts.find(o=>o.k===q.ans)||{}).t||''):'文档中没有答案'}</span>`;
    }else if(s.active===q.no)cls+=' act';
    const jump=s.submitted?`<button class="jump-btn" data-act="jump" data-no="${q.no}">原文</button>`:'';
    return `<div class="${cls}" id="row-${q.no}" data-act="blank" data-no="${q.no}"><span class="n">${q.no}</span><span class="val">${word?esc(a+') '+word):'—'}</span>${extra}${jump}</div>`;
  }).join('');
  return `<p class="hint">先点题号（或文中的空格），再点下面的单词填进去。</p><div class="bank">${pills}</div>${rows}`;
}

/* ---------- 选择题 UI ---------- */
function qHTML(q,sec){
  const s=session,a=s.answers[q.no],sub=s.submitted;
  const jump=sub?`<button class="jump-btn" data-act="jump" data-no="${q.no}">原文</button>`:'';
  let h=`<div class="q" id="q-${q.no}"><div class="stem"><span class="n">${q.no}</span>${q.text?rich(q.text):''}${jump}</div>`;
  const cls=k=>{
    let c=a===k?' sel':'';
    if(sub){if(k===q.ans)c+=' right';else if(a===k)c+=' wrong';}
    return c;
  };
  if(sec.type==='match')
    h+='<div class="letters">'+q.opts.map(o=>`<button class="lt${cls(o.k)}" data-act="pick" data-no="${q.no}" data-k="${o.k}">${o.k}</button>`).join('')+'</div>';
  else
    h+='<div class="opts">'+q.opts.map(o=>`<button class="opt${cls(o.k)}" data-act="pick" data-no="${q.no}" data-k="${o.k}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`).join('')+'</div>';
  if(sub){
    if(!q.ans)h+='<div class="status na">文档中没有找到这题的答案，不计分</div>';
    else if(!a)h+=`<div class="status na">未作答，正确答案 ${q.ans}</div>`;
    else if(a===q.ans)h+='<div class="status ok">答对了</div>';
    else h+=`<div class="status no">答错了，正确答案 ${q.ans}</div>`;
  }
  return h+'</div>';
}
function blockHTML(sec,b){
  const passage=b.passage.map(p=>{
    if(sec.type==='match'){
      const mm=/^\[([A-N])\]\s*/.exec(p);
      if(mm)return `<p id="para-${mm[1]}"><span class="pm">${mm[1]}</span>${rich(p.slice(mm[0].length))}</p>`;
    }
    return `<p>${rich(p)}</p>`;
  }).join('');
  const right=sec.type==='cloze'?clozeHTML(b):b.questions.map(q=>qHTML(q,sec)).join('');
  return `<div class="cols"><article class="pane passage">${passage}</article><div class="pane">${right}</div></div>`;
}
function jumpToAnswer(no){

/* ---------- 评分（满分 100） ---------- */
function calc(){
  const s=session;const per=[];
  let right=0,count=0;
  s.paper.sections.forEach(sec=>{
    const qs=sec.blocks.flatMap(b=>b.questions);
    let r=0,g=0;
    qs.forEach(q=>{if(q.ans){g++;if(s.answers[q.no]===q.ans)r++;}});
    right+=r;count+=g;
    per.push({short:sec.short,r,g,n:qs.length});
  });
  const score=count?+(right/count*100).toFixed(1):0;
  return {score,right,count,per};
}
function resultHTML(){
  const r=calc();
  const each=r.count?(100/r.count).toFixed(1):'—';
  return `<div class="card result">
    <div class="big">${r.score}<small>/ 100</small></div>
    <p class="muted">答对 ${r.right} / ${r.count} 题，每题 ${each} 分。</p>
    <div class="per">${r.per.map(p=>`<div>${esc(p.short)}<b>${p.g?(p.r/p.g*100).toFixed(0)+'%':'—'}</b>${p.r} / ${p.g} 题对</div>`).join('')}</div>
    <p class="muted">下面每题右上角的「原文」按钮可以跳到文章对应位置。这次做错的题，可以重做整套来巩固。</p>

}

  const done=counts.reduce((n,c)=>n+c.d,0),all=counts.reduce((n,c)=>n+c.t,0);

let reviewTimerHandle=null;
function startReviewTimer(){
  clearInterval(reviewTimerHandle);
  reviewTimerHandle=setInterval(()=>{
    if(!session||!session.review||session.stage!=='input'){return;}
    const el=$('#review-timer');if(!el)return;
    const secs=Math.floor((Date.now()-session.reviewStartAt)/1000);
    const limit=settings.recognizeSeconds;
    if(secs>=limit){
      el.classList.add('over');

    }else{
      el.classList.toggle('warn',secs>=limit*0.7);
      el.textContent='计时 '+secs+' / '+limit+' 秒';
    }
  },1000);
}
function makeBlankedSentence(sentence,word){
  if(!sentence)return '';
  const re=new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w{0,3}\\b','gi');
  let done=false;
  const out=sentence.replace(re,(m)=>{if(done)return m;done=true;return '<u>'+'_'.repeat(Math.max(4,m.length))+'</u>';});
  if(!done){
    const re2=new RegExp('\\w*'+word.slice(0,Math.max(3,word.length-2))+'\\w*','i');
    return sentence.replace(re2,m=>'<u>'+'_'.repeat(Math.max(4,m.length))+'</u>');
  }
  return out;
}

      <div class="review-actions">
        <button class="ghost${s.resultFlash==='no'?' rec':''}" data-act="reviewRate" data-rate="again">不认识</button>
        <button class="ghost" data-act="reviewRate" data-rate="hard">模糊</button>
        <button class="primary" data-act="reviewRate" data-rate="good">认识</button>
      </div>`}

function submitReviewInput(){
  const s=session;if(!s||!s.review)return;
  const v=s.reviewList[s.reviewIndex];if(!v)return;
  const el=$('#reviewInput');if(!el)return;
  const val=el.value.trim().toLowerCase();
  s.reviewInput=val;
  const correct=val===v.w.toLowerCase();
  s.stage='done';
  s.resultFlash=correct?'ok':'no';
  clearInterval(reviewTimerHandle);
  render();
  setTimeout(()=>{const i=$('#reviewInput');if(i)i.focus();},80);
}
function rateReview(rate){
  const s=session;if(!s||!s.review)return;
  const v=s.reviewList[s.reviewIndex];
  const live=vocab.find(x=>x.w===v.w);
  if(live)updateVocabAfterReview(live,rate);
  s.reviewIndex++;
  s.stage='input';
  s.reviewInput='';
  s.resultFlash=null;
  s.reviewStartAt=Date.now();
  if(s.reviewIndex>=s.reviewList.length){clearInterval(reviewTimerHandle);toast('今日复习完成');view='vocab';session=null;render();return;}
  render();
  startReviewTimer();
  setTimeout(()=>{const i=$('#reviewInput');if(i)i.focus();},80);
}
function updateVocabAfterReview(v,rate){
  const now=Date.now();
  let reps=v.reps||0,level=v.level||0,interval=v.interval||0;
  const ints=intervals();
  if(rate==='again'){reps=0;level=0;interval=ints[0];}
  else if(rate==='hard'){reps++;interval=Math.max(1,interval||ints[0]);}
  else{reps++;level=Math.min(ints.length-1,level+1);interval=ints[level];}
  v.reps=reps;v.level=level;v.interval=interval;v.nextReview=now+interval*86400000;v.lastReview=now;
  store.set('plsc_vocab',vocab);
}

function downloadJSON(obj,prefix){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url;a.download=prefix+'_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function doImport(file){
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data||typeof data!=='object')throw new Error('文件格式不对');
    const counts=`资料 ${(data.papers||[]).length}，生词 ${(data.vocab||[]).length}，记录 ${(data.history||[]).length}`;
    ask('导入数据？','将合并：'+counts+'。同 ID 的资料会被覆盖，其他数据会追加。','导入',()=>{
      const byId={};
      papers.forEach(p=>byId[p.id]=p);
      (data.papers||[]).forEach(p=>byId[p.id]=p);
      papers=Object.values(byId);
      const vMap={};vocab.forEach(v=>vMap[v.w]=v);
      (data.vocab||[]).forEach(v=>vMap[v.w]=v);
      vocab=Object.values(vMap);
      const seen=new Set(history.map(h=>h.id));
      (data.history||[]).forEach(h=>{if(!seen.has(h.id))history.push(h);});
      history.sort((a,b)=>b.date-a.date);history=history.slice(0,200);
      if(data.settings)settings=Object.assign({},settings,data.settings);
      vocabSet=new Set(vocab.map(v=>v.w));
      store.set('plsc_papers',papers);store.set('plsc_vocab',vocab);
      store.set('plsc_history',history);store.set('plsc_settings',settings);
      closeModal();render();toast('导入完成');
    });
  }catch(e){toast('导入失败：'+(e.message||e));}
}

/* ---------- 学习记录 ---------- */
function saveHistory(){
  const r=calc();
  const dur=Math.max(1,Math.round(currentSessionDuration()/1000));
  const item={
    id:Date.now(),paperId:session.paper.id,label:session.paper.label,
    language:session.paper.language||'',exam:session.paper.exam||'',
    mode:session.mock?'限时模考':'普通练习',date:Date.now(),
    score:r.score,right:r.right,count:r.count,duration:dur,
    per:r.per.map(x=>({short:x.short,r:x.r,g:x.g}))
  };
  history.unshift(item);
  history=history.slice(0,200);
  store.set('plsc_history',history);
}
function overallStats(){
  let count=0,right=0,duration=0;
  history.forEach(x=>{count+=x.count;right+=x.right;duration+=x.duration||0;});
  return {count,right,duration,rate:count?Math.round(right/count*100):0};
}
function trendSVG(items){
  if(items.length<2)return '<p class="muted">至少 2 次记录后显示趋势。</p>';
  const w=600,h=160,pad=30;
  const xs=items.map((x,i)=>pad+i*(w-2*pad)/(items.length-1));
  const ys=items.map(x=>pad+(100-x.score)/100*(h-2*pad));
  const pts=xs.map((x,i)=>x+','+ys[i]).join(' ');
  const dots=items.map((x,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="3.5" fill="#2a4bd7"><title>${x.score} 分</title></circle>`).join('');
  const grid=[0,25,50,75,100].map(v=>{
    const y=pad+(100-v)/100*(h-2*pad);
    return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#e8ecf4" stroke-width="1"/><text x="4" y="${y+4}" font-size="10" fill="#9aa3b6">${v}</text>`;
  }).join('');
  return `<div class="chart-wrap"><div class="chart-title">正确率趋势（最近 ${items.length} 次）</div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<polyline points="${pts}" fill="none" stroke="#2a4bd7" stroke-width="2"/>${dots}</svg></div>`;
}
function last7Days(){
  const out=[];
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){
    const d=new Date(today.getTime()-i*86400000);
    const t0=d.getTime(),t1=t0+86400000;
    const qs=history.filter(h=>h.date>=t0&&h.date<t1);
    out.push({label:(d.getMonth()+1)+'/'+d.getDate(),
      minutes:Math.round(qs.reduce((a,x)=>a+(x.duration||0),0)/60),
      count:qs.reduce((a,x)=>a+x.count,0)});
  }
  return out;
}
function weekBarsHTML(){
  const d=last7Days();
  const max=Math.max(10,...d.map(x=>x.minutes));
  return `<div class="chart-wrap"><div class="chart-title">近 7 天学习时长（分钟）</div>
    <div class="bars">${d.map(x=>`<div class="bar-row"><div class="bl"><span>${x.label}</span><span>${x.minutes} 分 · ${x.count} 题</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.minutes/max*100)}%"></div></div></div>`).join('')}</div>
  </div>`;
}
function profileHTML(){
  const s=overallStats();
  if(history.length<5)return `<p class="muted">数据积累中。练习满 5 次后，这里会显示你的能力分布。</p>`;
  const items=[];
  items.push({t:'正确率',v:s.rate,note:`${s.right}/${s.count} 题`});
  const durByQ=s.count?s.duration/s.count:0;
  const speed=Math.min(100,Math.max(10,Math.round(durByQ<40?85:durByQ<70?65:durByQ<100?45:25)));
  items.push({t:'答题速度',v:speed,note:`平均每题 ${Math.round(durByQ)} 秒`});
  const vocabScore=Math.min(100,Math.round(Math.log10(Math.max(1,vocab.length))*30));
  items.push({t:'词汇积累',v:vocabScore,note:`生词本 ${vocab.length} 个`});
  let h=`<div class="card"><h2>能力画像</h2>`;
  h+=items.map(x=>`<div class="bar-row" style="margin-bottom:10px"><div class="bl"><span>${esc(x.t)}</span><span>${x.v} · ${esc(x.note)}</span></div><div class="bar-track"><div class="bar-fill${x.v<40?' no':x.v<65?' warn':''}" style="width:${x.v}%"></div></div></div>`).join('');
  h+=`<p class="muted" style="margin-top:8px">基于你自己的练习记录估算，仅供长期参考。</p></div>`;
  return h;
}
function historyHTML(){
  let h=`<section class="card"><h2>学习记录</h2>`;
  if(!history.length){
    h+=`<p class="empty">完成一次练习后，这里会自动记录。</p></section>`;
    return h;
  }
  const s=overallStats();
  h+=`<div class="statgrid">
    <div class="stat">累计练习<b>${s.count} 题</b></div>
    <div class="stat ok">平均正确率<b>${s.rate}%</b></div>
    <div class="stat">累计时长<b>${fmtDuration(s.duration)}</b></div>
    <div class="stat">练习次数<b>${history.length}</b></div>
  </div></section>`;
  h+=profileHTML();
  h+=`<section class="card"><h2>趋势</h2>${trendSVG(history.slice(0,12).slice().reverse())}${weekBarsHTML()}</section>`;
  h+=`<section class="card"><h2>历史记录</h2>
    <table class="history">
      <thead><tr><th>日期</th><th>资料</th><th>对/总</th><th>得分</th><th>用时</th></tr></thead>
      <tbody>`;
  h+=history.slice(0,50).map(x=>`<tr>
    <td>${new Date(x.date).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}</td>
    <td>${esc(x.label)}<br><span class="mini">${esc(x.mode)}</span></td>
    <td>${x.right}/${x.count}</td>
    <td><b>${x.score}</b></td>
    <td>${fmtDuration(x.duration)}</td>
  </tr>`).join('');
  h+=`</tbody></table>`;
  h+=`<div class="btns"><button class="danger" data-act="clearHistory">清空记录</button></div></section>`;
  return h;
}

/* ---------- 设置页 ---------- */
function settingsHTML(){
  let h=`<section class="card"><h2>设置</h2>
    <p class="muted">所有参数立即生效，保存在本浏览器。</p>`;
  h+=`<div class="setting-row"><div><div class="lbl">每日新词上限</div><div class="desc">超过的新词自动顺延到次日</div></div><input type="number" min="0" max="100" data-set="dailyNew" value="${settings.dailyNew}"></div>`;
  h+=`<div class="setting-row"><div><div class="lbl">每日复习上限</div><div class="desc">避免一天复习过多产生疲劳</div></div><input type="number" min="0" max="500" data-set="dailyReview" value="${settings.dailyReview}"></div>`;
  h+=`<div class="setting-row"><div><div class="lbl">认识判定秒数</div><div class="desc">在输入框出现后多久内提交视为"熟"</div></div><input type="number" min="3" max="120" data-set="recognizeSeconds" value="${settings.recognizeSeconds}"></div>`;
  h+=`<div class="setting-row"><div><div class="lbl">复习间隔（天）</div><div class="desc">认识 → 依次间隔；模糊 → 不变；不认识 → 重置</div></div><input type="text" data-set="intervals" value="${esc(settings.intervals)}"></div>`;
  h+=`<div class="setting-row"><div><div class="lbl">无操作暂停（秒）</div><div class="desc">离开页面或无操作时暂停计时</div></div><input type="number" min="10" max="600" data-set="autoPauseSeconds" value="${settings.autoPauseSeconds}"></div>`;
  h+=`<div class="setting-row"><div><div class="lbl">重复导入提醒</div><div class="desc">相同内容的试卷不再重复入库</div></div><input type="text" data-set="duplicateCheck" value="${settings.duplicateCheck?'开':'关'}" style="width:60px" readonly></div>`;
  h+=`<div class="btns" style="justify-content:flex-start;margin-top:14px">
      <button class="ghost" data-act="resetSettings">恢复默认设置</button>
    </div></section>`;
  h+=`<section class="card"><h2>数据</h2>
    <p class="muted">数据仅保存在本浏览器。换设备、清缓存会丢失，请定期导出备份。</p>
    <div class="btns" style="justify-content:flex-start">
      <button class="ghost" data-act="exportData">导出全部数据</button>
      <button class="ghost" data-act="importData">从备份导入</button>
      <button class="danger" data-act="clearAll">清空所有数据</button>
    </div></section>`;
  h+=`<section class="card"><h2>关于</h2>
    <p class="muted">个人语言学习中心 · 本地优先，无联网、无账号。数据与进度完全属于你。</p>
  </section>`;
  return h;
}
  /* ---------- 渲染 ---------- */
function render(keep){
  const y=window.scrollY,ps=[...document.querySelectorAll('.pane')].map(e=>e.scrollTop);
  document.querySelectorAll('nav button').forEach(b=>{
    const v=b.dataset.view;
    const match=v===view
      ||(view==='detail'&&v==='library')
      ||(view==='test'&&v==='library')
      ||(view==='review'&&v==='vocab');
    b.classList.toggle('on',match);
  });
  $('#vc').textContent=vocab.length||'';
  let html='';
  if(view==='home')html=homeHTML();
  else if(view==='library')html=libraryHTML();
  else if(view==='detail')html=detailHTML();
  else if(view==='vocab')html=vocabHTML();
  else if(view==='history')html=historyHTML();
  else if(view==='settings')html=settingsHTML();
  else if(view==='review'&&session&&session.review)html=reviewHTML();
  else if(view==='test'&&session&&session.paper)html=testHTML();
  else html=homeHTML();
  $('#app').innerHTML=html;
  if(keep){
    window.scrollTo(0,y);
    document.querySelectorAll('.pane').forEach((e,i)=>{if(ps[i]!=null)e.scrollTop=ps[i];});
  }else window.scrollTo(0,0);
  store.checkSize();
}

/* ---------- 历史栈（返回键） ---------- */
function pushHistory(v){
  try{if(history.state&&history.state.view===v)return;history.pushState({view:v},'',location.pathname+'#'+v);}catch(e){}
}
window.addEventListener('popstate',function(e){
  const v=e.state&&e.state.view?e.state.view:'home';
  if(view!=='test'&&view!=='review'){
    view=v;detailId=null;closeModal();
    if(v!=='test'&&v!=='review'){session=null;clearInterval(timerHandle);}
    render();
  }else{
    try{history.pushState({view},'',location.pathname+'#'+view);}catch(err){}
  }
});

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const w=e.target.closest('.w');
  if(w){toggleWord(w.dataset.w,w.dataset.sentence||'');return;}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const d=el.dataset,s=session;
  switch(d.act){
    case 'nav':{
      view=d.view;detailId=null;closeModal();clearInterval(timerHandle);clearInterval(reviewTimerHandle);
      if(view!=='test'&&view!=='review'){session=null;}
      pushHistory(view);
      render();break;}
    case 'detail':detailId=d.id;view='detail';closeModal();render();break;
    case 'start':startPaper(d.id,false);break;
    case 'startMock':startPaper(d.id,true);break;
    case 'startReview':startReview();break;
    case 'dismissFirst':firstVisit=false;store.set('plsc_seen_local_notice',true);render(true);break;
    case 'dismissStorage':storageWarnShown=true;store.set('plsc_storage_warned',true);document.getElementById('storage-warn').style.display='none';break;
    case 'jump':jumpToAnswer(+d.no);break;
    case 'reviewSubmit':submitReviewInput();break;
    case 'reviewSkip':{
      if(!session||!session.review)return;
      const v=session.reviewList[session.reviewIndex];if(!v)return;
      const live=vocab.find(x=>x.w===v.w);
      if(live)updateVocabAfterReview(live,'again');
      session.reviewIndex++;session.stage='input';session.reviewInput='';session.resultFlash=null;session.reviewStartAt=Date.now();
      if(session.reviewIndex>=session.reviewList.length){clearInterval(reviewTimerHandle);toast('今日复习完成');view='vocab';session=null;render();return;}
      render();startReviewTimer();setTimeout(()=>{const i=$('#reviewInput');if(i)i.focus();},80);
      break;}
    case 'reviewRate':rateReview(d.rate);break;
    case 'toggleMastered':toggleMastered(d.w);break;
    case 'clearHistory':
      ask('清空学习记录？','所有历史记录都会删除，题库、生词、设置不受影响。','清空',()=>{history=[];store.set('plsc_history',history);closeModal();render();});
      break;
    case 'clearAll':
      ask('清空所有数据？','题库、生词、记录、设置全部删除，且不可恢复。建议先导出备份。','全部清空',()=>{
        try{['plsc_papers','plsc_vocab','plsc_history','plsc_settings','plsc_seen_local_notice','plsc_storage_warned'].forEach(k=>localStorage.removeItem(k));}catch(e){}
        papers=[];vocab=[];history=[];vocabSet=new Set();settings=Object.assign({},DEFAULT_SETTINGS);
        closeModal();view='home';render();toast('已清空');
      });break;
    case 'resetSettings':
      ask('恢复默认设置？','每日新词、复习上限、间隔等参数都会恢复出厂值。','恢复',()=>{settings=Object.assign({},DEFAULT_SETTINGS);saveSettings();closeModal();render();toast('已恢复');});
      break;
    case 'delPaper':ask('删除这份资料？','试卷会从资料库移除。引用它的生词来源会显示"（资料已删除）"。','删除',()=>{
      const pp=papers.find(x=>x.id===d.id);
      papers=papers.filter(p=>p.id!==d.id);
      vocab.forEach(v=>{if(pp&&v.source===pp.label)v.source='（资料已删除）';});
      store.set('plsc_papers',papers);store.set('plsc_vocab',vocab);
      closeModal();if(view==='detail'){view='library';detailId=null;}render();toast('已删除');});break;
    case 'editAns':{
      const pp=papers.find(x=>x.id===d.id);if(!pp)break;
      const qs=pp.sections.flatMap(se=>se.blocks.flatMap(b=>b.questions));
      modal(`<div class="dlg"><h3>补充答案</h3><p class="muted">${esc(pp.label)}，目前有答案 ${qs.filter(q=>q.ans).length} / ${qs.length} 题。</p>
        <label class="muted">${ANS_HINT}</label>
        <div class="ans-btns"><button type="button" data-act="pickAnsFile">从文件导入答案</button></div>
        <textarea id="aAns" placeholder="${ANS_HINT}"></textarea>
        <div class="btns"><button class="ghost" data-act="close">取消</button><button class="primary" data-act="saveAns" data-id="${esc(pp.id)}">保存答案</button></div></div>`);
      break;}
    case 'pickAnsFile':$('#ansFile').click();break;
    case 'saveAns':{
      const pp=papers.find(x=>x.id===d.id);if(!pp)break;
      const v=($('#aAns')||{}).value||'';
      if(!v.trim()){toast('还没有填答案');break;}
      const r=applyAnswers(pp,v);store.set('plsc_papers',papers);closeModal();render();toast('已更新，现有答案 '+r+' 题');break;}
    case 'pickFile':$('#file').click();break;
    case 'parsePaste':{const v=($('#paste')||{}).value||'';
      if(v.trim().length<200){toast('文字太少了，请粘贴完整试卷');break;}
      openPreview('粘贴文本',v,false,contentHash(v));break;}
    case 'savePaper':savePaper();break;
    case 'close':closeModal();pending=null;nextFile();break;
    case 'ok':if(okCb){const f=okCb;okCb=null;f();}break;
    case 'tab':s.tab=+d.i;render();break;
    case 'blank':if(s&&!s.submitted){s.active=+d.no;render(true);}break;
    case 'bank':{
      if(s.submitted)break;
      if(s.active==null){toast('先点一个空格');break;}
      const no=s.active;
      Object.keys(s.answers).forEach(n=>{if(s.qmap[n].type==='cloze'&&s.answers[n]===d.k)delete s.answers[n];});
      s.answers[no]=d.k;
      const nos=Object.keys(s.qmap).filter(n=>s.qmap[n].type==='cloze').map(Number).sort((a,b)=>a-b);
      s.active=nos.find(n=>n>no&&!s.answers[n])||nos.find(n=>!s.answers[n])||no;
      render(true);break;}
    case 'pick':
      if(s.submitted)break;
      if(s.answers[d.no]===d.k)delete s.answers[d.no];else s.answers[d.no]=d.k;
      render(true);break;
    case 'submit':{
      const left=Object.keys(s.qmap).filter(n=>!s.answers[n]).length;
      const go=()=>{
        commitAccum();
        s.submitted=true;clearInterval(timerHandle);
        if(!s.historySaved){saveHistory();s.historySaved=true;}
        closeModal();render();
      };
      if(left)ask('还有题没做完','还有 '+left+' 题没有作答，确定提交吗？','仍然提交',go);else go();
      break;}
    case 'redo':startPaper(s.paper.id,s.mock);break;
    case 'delWord':
      vocab=vocab.filter(v=>v.w!==d.w);vocabSet.delete(d.w);store.set('plsc_vocab',vocab);render(true);break;
    case 'exportData':exportData();break;
    case 'exportVocab':exportVocab();break;
    case 'importData':importData();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='vq'){
    vocabQuery=t.value;
    const list=vocab.filter(v=>!vocabQuery||v.w.toLowerCase().includes(vocabQuery.toLowerCase()));
    const ul=document.querySelector('.vlist');if(!ul)return;
    const now=Date.now();
    ul.innerHTML=(reviewLangFilter?list.filter(v=>(v.language||'未分类')===reviewLangFilter):list).map(v=>{
      const isDue=!v.mastered&&(!v.nextReview||v.nextReview<=now);
      return `<li>
        <div class="vbody">
          <div class="vw">${esc(v.w)}${v.mastered?' <span class="mini" style="color:var(--ok)">已掌握</span>':''}</div>
          <input class="vocab-meaning" data-act="editMeaning" data-w="${esc(v.w)}" value="${esc(v.meaning||'')}" placeholder="填写释义（可空）">
          <div class="vsen">${esc(v.sentence||'暂无原句')}</div>
          <div class="vsrc">${esc(v.source||'未知来源')}${v.nextReview&&!v.mastered?' · 下次复习 '+fmtDate(v.nextReview):''}${isDue?' · <b>待复习</b>':''}</div>
          <div class="vocab-actions"><button class="${v.mastered?'mastered':''}" data-act="toggleMastered" data-w="${esc(v.w)}">${v.mastered?'取消掌握':'标记已掌握'}</button></div>
        </div>
        <button class="x" data-act="delWord" data-w="${esc(v.w)}">×</button>
      </li>`;
    }).join('') || '<li style="display:block;border:0;text-align:center;color:var(--mut)">没有匹配的生词</li>';
  }else if(t.classList&&t.classList.contains('vocab-meaning')){
    updateMeaning(t.dataset.w,t.value);
  }else if(t.dataset&&t.dataset.set){
    const k=t.dataset.set;
    if(k==='intervals')settings.intervals=t.value;
    else if(k==='duplicateCheck')return;
    else settings[k]=+t.value||0;
    saveSettings();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'&&t.files.length){const fs=[...t.files];t.value='';handleFiles(fs);}
  else if(t.id==='importFile'&&t.files.length){const f=t.files[0];t.value='';doImport(f);}
  else if(t.id==='ansFile'&&t.files.length){const f=t.files[0];t.value='';importAnswerFile(f);}
  else if(t.id==='vlang'){reviewLangFilter=t.value;render(true);}
  else if(t.dataset&&t.dataset.set){
    const k=t.dataset.set;
    if(k==='intervals')settings.intervals=t.value;
    else if(k==='duplicateCheck')return;
    else settings[k]=+t.value||0;
    saveSettings();
  }
});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  const fs=e.dataTransfer?[...e.dataTransfer.files]:[];
  if(fs.length&&(view==='home'||view==='library'))handleFiles(fs);
});
/* 全局快捷键：1/2/3/4 选项，Enter 提交 */
document.addEventListener('keydown',e=>{
  if(!session||!session.paper||session.submitted)return;
  if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(/^[1-4]$/.test(e.key)){
    const qs=session.paper.sections[session.tab].blocks.flatMap(b=>b.questions);
    const firstUn=qs.find(q=>!session.answers[q.no]&&q.opts&&q.opts.length>=+e.key);
    if(firstUn){
      const k=['A','B','C','D'][+e.key-1];
      const opts=firstUn.opts;
      if(opts.find(o=>o.k===k)){session.answers[firstUn.no]=k;render(true);}
    }
  }
});

/* ---------- 初始化 ---------- */
try{
  history.pushState({view:'home'},'','#home');
}catch(e){}
render();
})();
</script>
