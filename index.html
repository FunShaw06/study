<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人语言学习中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#eaeef5;--paper:#ffffff;--ink:#14213d;--mut:#667089;--line:#d3dae7;
  --blue:#2a4bd7;--blue-s:#e3e9fc;--ok:#1b8a5a;--ok-s:#dcf3e8;--no:#d1344a;--no-s:#fbe3e7;
  --warn:#d97706;--warn-s:#fef3c7;--hl:#ffe45c;
  --ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Iowan Old Style","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--ink);color:#fff;gap:8px}
.brand{font:700 17px var(--serif);letter-spacing:.03em;display:flex;flex-direction:column;line-height:1.15}
.brand small{font:400 11px var(--ui);opacity:.6;letter-spacing:.05em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;border-radius:8px;color:#fff;padding:6px 9px;font-size:13px}
nav button.on{background:#fff;color:var(--ink)}
#vc:not(:empty){margin-left:4px;background:var(--hl);color:var(--ink);border-radius:10px;padding:0 5px;font-size:11px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:16px 14px 110px}
h2{font:700 19px var(--serif);margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3{font:700 15px var(--serif);margin:16px 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1;min-width:120px}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{min-height:100px;resize:vertical}
.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 18px}
.danger{background:#fff;border:1px solid var(--no);color:var(--no);border-radius:10px;padding:10px 18px}
.link{background:none;border:0;color:var(--blue);padding:4px 0;font-weight:600;font-size:14px}
.muted{color:var(--mut);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center}
.drop p{margin:6px 0 12px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--blue);font-weight:600}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-s);border:1px solid var(--warn);color:#92400e}
.notice.info{background:var(--blue-s);border:1px solid var(--blue);color:#1e3a8a}
.notice.no{background:var(--no-s);border:1px solid var(--no);color:#7f1d1d}
.notice .body{flex:1}
.notice button{background:none;border:0;color:inherit;font-weight:600;padding:0 4px;flex:none}
.tree{margin-top:4px}
.tree-lang{margin-bottom:14px}
.tree-lang>.tl{font:700 15px var(--ui);margin-bottom:6px;letter-spacing:.02em}
.tree-exam{margin-left:12px;margin-bottom:8px}
.tree-exam>.te{font:600 13px var(--ui);color:var(--mut);margin-bottom:4px}
.tree-items{display:flex;flex-wrap:wrap;gap:6px;margin-left:10px}
.ti{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-align:left;font-size:13px;font-weight:600}
.ti i{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--mut)}
.ti:hover{border-color:var(--blue);color:var(--blue)}
.ti.miss{border-color:var(--warn);background:var(--warn-s)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0 4px}
.meta-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.meta-item span{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.sec-list{list-style:none;padding:0;margin:8px 0 12px}
.sec-list li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sec-list li:last-child{border-bottom:0}
.recent{list-style:none;padding:0;margin:0}
.recent li{padding:10px 0;border-bottom:1px solid var(--line)}
.recent li:last-child{border-bottom:0}
.rt{font-weight:600}
.rm{font-size:12px;color:var(--mut);margin-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut)}
.stat b{display:block;font:700 20px var(--serif);color:var(--ink);margin-top:2px}
.stat.ok b{color:var(--ok)}
.stat.no b{color:var(--no)}
.stat.warn b{color:var(--warn)}
.vlist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr;gap:8px}
.vlist li{display:flex;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;gap:8px}
.vbody{flex:1;min-width:0}
.vw{font:700 18px var(--serif)}
.vsen{font:14px/1.6 var(--serif);color:#3a4460;margin:4px 0;word-break:break-word}
.vsrc{font-size:11px;color:var(--mut)}
.vlist .x{border:0;background:var(--no-s);color:var(--no);width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;flex:none}
.vocab-meaning{width:100%;margin-top:6px;padding:7px 9px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff}
.vocab-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.vocab-actions button{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--mut)}
.vocab-actions button.mastered{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
.review-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.review-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.review-word{font:700 26px var(--serif);margin:0}
.review-timer{font-size:13px;color:var(--mut)}
.review-timer.warn{color:var(--warn);font-weight:600}
.review-timer.over{color:var(--no);font-weight:600}
.review-meaning{font-size:14px;color:var(--ink);padding:8px 0 12px;border-bottom:1px dashed var(--line);margin-bottom:12px;min-height:22px}
.review-meaning.empty-m{color:var(--mut);font-style:italic;font-size:13px}
.review-blank{font:17px/1.85 var(--serif);padding:12px;background:#f7f8fb;border-radius:10px}
.review-blank u{color:var(--blue);text-decoration:none;border-bottom:2px solid var(--blue);padding:0 30px;letter-spacing:2px;font-weight:600}
.review-input{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:10px;margin-top:12px;font-family:var(--serif);text-align:center;letter-spacing:1px}
.review-input:focus{border-color:var(--blue)}
.review-input.ok{border-color:var(--ok);background:var(--ok-s)}
.review-input.no{border-color:var(--no);background:var(--no-s)}
.review-answer{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px}
.review-answer.ok{background:var(--ok-s);color:var(--ok);font-weight:600}
.review-answer.no{background:var(--no-s);color:var(--no);font-weight:600}
.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.review-actions button{flex:1;min-width:70px}
.review-actions button.rec{border:2px solid var(--blue);background:var(--blue-s);color:var(--blue);font-weight:600}
.history{width:100%;border-collapse:collapse;font-size:13px}
.history th,.history td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mini{font-size:12px;color:var(--mut)}
.chart-wrap{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfe;margin:8px 0}
.chart-title{font-weight:600;font-size:14px;margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto}
.bars{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bar-row{font-size:13px}
.bar-row .bl{display:flex;justify-content:space-between;margin-bottom:3px}
.bar-track{background:#eef1f7;border-radius:6px;overflow:hidden;height:10px}
.bar-fill{height:100%;background:var(--blue);border-radius:6px}
.bar-fill.warn{background:var(--warn)}
.bar-fill.no{background:var(--no)}
.plan-list{list-style:none;padding:0;margin:8px 0}
.plan-list li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfe}
.plan-list li b{display:block;margin-bottom:3px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row>div{flex:1}
.setting-row .lbl{font-weight:600;font-size:14px}
.setting-row .desc{font-size:12px;color:var(--mut);margin-top:2px}
.setting-row input[type=number],.setting-row input[type=text]{width:100px;flex:none;text-align:right;font-size:15px;padding:7px 10px}
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tbar b{font:700 17px var(--serif)}
.timer{font:700 22px var(--serif);letter-spacing:.04em;margin-left:auto}
.timer.warn{color:var(--no)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{flex:1;min-width:112px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left}
.tab i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on i{color:#c4cbe0}
.cols{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.passage{font:17px/1.85 var(--serif)}
.passage p{margin:0 0 .9em;max-width:70ch}
.pm{display:inline-block;min-width:1.6em;margin-right:.4em;padding:0 .35em;border-radius:6px;background:var(--ink);color:#fff;font:700 14px var(--ui);text-align:center}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--blue-s)}
.w.saved{background:var(--hl)}
.blank{display:inline-block;min-width:5.4em;text-align:center;border-bottom:2px solid var(--ink);margin:0 .15em;padding:0 .3em;cursor:pointer;font-family:var(--ui);font-size:15px;line-height:1.5}
.blank sup{font-size:11px;font-weight:700;margin-right:3px;color:var(--blue)}
.blank.act{background:var(--blue-s);border-color:var(--blue)}
.blank.ok{background:var(--ok-s);border-color:var(--ok)}
.blank.no{background:var(--no-s);border-color:var(--no)}
.blank.hl{animation:flash 1.6s ease}
@keyframes flash{0%,100%{background:transparent}30%,60%{background:var(--hl)}}
.hint{margin:0 0 10px;color:var(--mut);font-size:13px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;position:sticky;top:56px;background:var(--paper);padding:6px 0;z-index:5}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px 4px 5px}
.pill b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-size:12px}
.pill.used{opacity:.4}
.brow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.brow .n{font-weight:700;width:28px}
.brow .val{flex:1}
.brow.act{border-color:var(--blue);background:var(--blue-s)}
.brow.ok{border-color:var(--ok);background:var(--ok-s)}
.brow.no{border-color:var(--no);background:var(--no-s)}
.fix{color:var(--ok);font-weight:600;font-size:13px}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.stem{margin-bottom:8px}
.stem .n{display:inline-block;min-width:26px;font-weight:700;color:var(--blue)}
.jump-btn{font-size:12px;padding:2px 10px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--blue);margin-left:8px;font-weight:600;vertical-align:middle}
.jump-btn:hover{background:var(--blue-s);border-color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bub,.opt b,.lt{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);font-size:13px;font-weight:700;background:#fff}
.opt.sel,.lt.sel{border-color:var(--ink)}
.opt.sel b,.lt.sel{background:var(--ink);color:#fff}
.opt.right{background:var(--ok-s);border-color:var(--ok)}
.opt.right b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--no-s);border-color:var(--no)}
.opt.wrong b{background:var(--no);border-color:var(--no);color:#fff}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.lt{width:34px;height:34px;padding:0}
.lt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.lt.wrong{background:var(--no);border-color:var(--no);color:#fff}
.status{margin-top:8px;font-size:13px;font-weight:600}
.status.ok{color:var(--ok)}.status.no{color:var(--no)}.status.na{color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result{border:2px solid var(--ink)}
.big{font:700 44px/1.1 var(--serif)}
.big small{font-size:18px;color:var(--mut);font-weight:400;margin-left:4px}
.per{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.per div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.per b{display:block;font-size:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{display:none;position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:50;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex}
.dlg{background:#fff;border-radius:14px;padding:18px;max-width:620px;width:100%;max-height:88vh;overflow:auto}
.dlg h3{font:700 19px var(--serif);margin:0 0 10px}
.sum{margin:10px 0;padding-left:18px}
.warn{color:var(--no);font-size:13px;margin:6px 0}
.ans-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ans-btns button{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue)}
pre{white-space:pre-wrap;font-size:12px;background:#f4f6fa;padding:10px;border-radius:8px;max-height:220px;overflow:auto}
@media(min-width:900px){
  .cols{grid-template-columns:1.2fr 1fr;align-items:start}
  .pane{max-height:calc(100vh - 200px);overflow:auto}
  .vlist{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.blank.hl{animation:none}}
</style>
</head>

<div id="fatal" style="display:none;position:fixed;top:0;left:0;right:0;background:#d1344a;color:#fff;padding:12px;z-index:9999;font-size:13px;word-break:break-all;max-height:60vh;overflow:auto"></div>
<script>
/* 早期错误捕获：任何脚本报错都直接显示在页面上，方便定位 */
window.__bootLog = [];
window.addEventListener('error', function (e) {
  var d = document.getElementById('fatal');
  if (d) {
    d.style.display = 'block';
    d.textContent = '页面脚本出错：' + (e.message || '未知') +
      (e.lineno ? '  （第 ' + e.lineno + ' 行）' : '') +
      (e.filename ? '  ' + String(e.filename).split('/').pop() : '');
  }
}, true);
window.addEventListener('unhandledrejection', function (e) {
  var d = document.getElementById('fatal');
  if (d) {
    d.style.display = 'block';
    d.textContent = '页面脚本出错（异步）：' + ((e.reason && (e.reason.message || e.reason)) || '未知');
  }
});
</script>

<script>
(function(){
'use strict';
/* ===================== 基础工具 ===================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DAY = 86400000;

/* ===================== 本地存储（失败自动降级内存） ===================== */
const store = {
  mem: {},
  diskOK: true,
  get(k, d) {
    try {
      const v = localStorage.getItem(k);
      if (v === null) return (k in this.mem) ? this.mem[k] : d;
      return JSON.parse(v);
    } catch (e) {
      return (k in this.mem) ? this.mem[k] : d;
    }
  },
  set(k, v) {
    this.mem[k] = v;
    try {
      localStorage.setItem(k, JSON.stringify(v));
      this.diskOK = true;
    } catch (e) {
      this.diskOK = false;
      setTimeout(() => showStorageWarn(), 0);
    }
    checkStorageSize();
  },
  remove(k) {
    delete this.mem[k];
    try { localStorage.removeItem(k); } catch (e) {}
  }
};

function usageKB() {
  let total = 0;
  try {
    for (const k in localStorage) {
      if (k.indexOf('plsc_') === 0) total += (localStorage[k] || '').length;
    }
  } catch (e) {}
  return total / 1024;
}

function checkStorageSize() {
  const kb = usageKB();
  const el = $('#storage-warn');
  if (el) el.style.display = (kb > 3800 || !store.diskOK) ? 'flex' : 'none';
}

function showStorageWarn() {
  const el = $('#storage-warn');
  if (el) el.style.display = 'flex';
  toast('浏览器存储写入失败，已切换到内存模式，请立即导出备份');
}

/* ===================== 全局状态 ===================== */
let view = 'home';
let papers = [];
let vocab = [];
let history = [];
let settings = {};
let pending = null;      // 待确认导入
let session = null;      // 练习/模考会话
let queue = [];          // 多文件导入队列
let vocabQuery = '';
let reviewLangFilter = '';
let timerHandle = null;
let sessionStart = 0, sessionAccum = 0, sessionPaused = false, lastActivity = Date.now();

const DEFAULT_SETTINGS = {
  dailyNew: 10,
  dailyReview: 50,
  recognizeSeconds: 10,
  intervals: '1,2,4,7,15,30',
  autoPauseSeconds: 60,
  warnMissingAnswers: true,

/* ===================== 日期/时间格式化 ===================== */
function fmtDate(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function fmtRelTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < DAY) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 7 * DAY) return Math.floor(diff / DAY) + ' 天前';
  return fmtDate(ts);
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h) return h + ' 小时 ' + m + ' 分';
  if (m) return m + ' 分钟';
  return sec + ' 秒';
}
function fmtTimer(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function isSameDay(a, b) {
  const x = new Date(a), y = new Date(b);
  return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
}

/* ===================== 内容哈希（重复检测） ===================== */
function contentHash(text) {
  const s = String(text);
  const head = s.slice(0, 2000);
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < head.length; i++) {
    h1 ^= head.charCodeAt(i); h1 = (h1 * 0x01000193) >>> 0;
  }
  for (let i = 0; i < s.length; i += 7) {
    h2 ^= s.charCodeAt(i); h2 = (h2 * 0x01000193) >>> 0;
  }
  return h1.toString(36) + s.length.toString(36) + h2.toString(36);
}

/* ===================== 统计工具 ===================== */
function allQuestions(paper) {
  const out = [];
  if (!paper || !paper.sections) return out;
  paper.sections.forEach(sec => (sec.blocks || []).forEach(b => (b.questions || []).forEach(q => out.push(q))));
  return out;
}
function countQuestions(paper) { return allQuestions(paper).length; }
function countAnswered(paper) { return allQuestions(paper).filter(q => q.ans).length; }
/* ===================== 文本规范化 ===================== */
/* PDF 抽取会把单词拆成 "Se ction" "P assage O ne"，这里生成容忍空格的单词正则 */
function word(chars) {
  return chars.split('').map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*').join('');
}
const W_SECTION = word('Section');
const W_PASSAGE = word('Passage');
const W_DIRECTIONS = word('Directions');
const W_ANSWERSHEET = word('Answer') + '\\s*' + word('Sheet');
const W_STATEMENTS = word('Statements');
const W_BANKED = word('Banked') + '\\s*' + word('Cloze');
const W_LONGREAD = '(' + word('Long') + '\\s*' + word('Reading') + '|' + word('Matching') + ')';
const W_CAREFUL = '(' + word('Careful') + '\\s*' + word('Reading') + '|' + word('Passages') + ')';
const W_READING = word('Reading') + '\\s*' + word('Comprehension');

function norm(t) {
  return String(t || '')
    .replace(/\r/g, '')
    .replace(/[\u00a0\u2002\u2003\u3000\u200b\ufeff]/g, ' ')
    /* 全角标点转半角 */
    .replace(/（/g, '(').replace(/）/g, ')')
    .replace(/[［【]/g, '[').replace(/[］】]/g, ']')
    .replace(/．/g, '.').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    /* OCR 修复：Part III 的各种误识别 */
    .replace(/\bPart\s+(?:Ill|I1I|IIl|II1|IIl)\b/gi, 'Part III')
    .replace(/\bPart\s+1V\b/gi, 'Part IV')
    /* OCR 修复：[3o] → [30] */
    .replace(/\[(\d)[oO](\d?)\]/g, (m, a, b) => '[' + a + '0' + (b || '') + ']')
    /* 去掉行首孤立的小数字（PDF 行号栏），但保留 26-45 的题号行 */
    .replace(/^[ \t]*(\d{1,2})[ \t]*[.、)][ \t]*$/gm, (m, n) => (+n >= 26 && +n <= 45) ? m : '')
    /* 去双题号："1.\n\n36." → "36."（允许换行/空行分隔） */
    .replace(/(^|\n)[ \t]*\d{1,2}[ \t]*[.、)][ \t]*(?:\n[ \t]*)*(\d{1,2})[ \t]*[.、)][ \t]*/g,
      (m, pre, n) => pre + n + '. ')
    /* 空白归一 */
    .replace(/[ \t]+/g, ' ')
    .replace(/ ?\n ?/g, '\n')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

/* 去掉 PDF 页眉/页脚噪声行。
   注意：本套真题里选词填空的空格题号是「单独成行的纯数字」（如一行只有 26），
   所以绝不能把所有纯数字行都当页码删掉——只删 26-45 区间之外的。 */
function stripNoise(text) {
  return String(text || '').split('\n').filter(line => {
    const s = line.trim();
    if (!s) return false;
    if (/^\d{1,3}$/.test(s)) {
      const n = +s;
      return n >= 26 && n <= 45;      // 保留题号行，删掉页眉页码
    }
    if (/^第?\s*\d{1,3}\s*页$/.test(s)) return false;
    if (/^(大学英语六级考试|六级真题|答案解析|仅供参考)[\s\d]*$/.test(s)) return false;
    if (/^20\d\d$/.test(s)) return false;
    return true;
  }).join('\n');
}

/* ===================== 答案解析 ===================== */
/* 支持：区间 26-30 ABCDE / 单题 26A 26.A 26:A 26-A / 逐行 "26\nA" / 纯字母序列
   注意：答案字母必须放开到 A-Z。
   长篇阅读是 15 个段落 A-O，但答案里出现 P/Q/R 完全正常
   （例如 2025年12月第三套 36=Q、40=R），只认 A-O 会把这两题直接丢掉。 */
function parseAnswerPairs(s) {
  const out = {};
  let t = String(s || '')
    .replace(/[，,;；、]/g, ' ')
    .replace(/[\r\n]+/g, ' ');
  // 去掉解析文字里的 (J) 之类括注以外的干扰：统一大写便于匹配
  t = t.toUpperCase();

  // 1) 区间格式：26-30 ABCDE
  t = t.replace(/(\d{1,2})\s*[-–—~～至到]\s*(\d{1,2})\s*[.:：、)]?\s*((?:[A-Z]\s*){2,})(?![A-Z])/g,
    (all, a, b, letters) => {
      a = +a; b = +b;
      const ls = letters.replace(/\s+/g, '').split('');
      if (b - a + 1 === ls.length) {
        ls.forEach((l, i) => { if (!((a + i) in out)) out[a + i] = l; });
        return ' ';
      }
      return all;
    });

  // 2) 单题格式：26A / 26.A / 26:A / 26-A / 26 A
  const re = /(\d{1,2})\s*[.:：、\-–)]?\s*([A-Z])(?![A-Z])/g;
  let m;
  while ((m = re.exec(t))) {
    const no = +m[1];
    if (no >= 1 && no <= 99 && !(no in out)) out[no] = m[2];
  }
  return out;
}
const countPairs = s => Object.keys(parseAnswerPairs(s)).length;

/* 判断一段文本是否真的像"答案清单"（而不是正文/说明里恰好出现的数字和字母） */
function looksLikeAnswerList(s) {
  if (!s) return false;
  const n = countPairs(s);
  if (n < 12) return false;
  // 答案清单的题号/字母密度远高于正文散文
  const density = n / Math.max(1, s.length) * 1000;
  if (density < 3.0) return false;
  // 答案清单里字母基本只以"题号+字母"的形式出现；正文散文里裸字母很少
  const bare = (s.match(/(?:^|[\s(])([A-Z])(?![A-Za-z])/g) || []).length;
  if (bare < n * 0.5) return false;
  // 必须出现明确的答案标识（不能是 "Answer the questions" / "Answer Sheet"）
  return /参考\s*答案|答案\s*解析|答案\s*与?\s*解析|答\s*案|answer\s*keys?\b/i.test(s);
}

/* 从整份文档中分离正文与答案块。
   注意：PDF 抽取会把中文标题拆成 "答 案 速 查"，所以匹配前先把空白去掉再定位。
   答案块用"删除对应行"的方式剥离，保证正文的换行结构不被破坏。 */
function extractAnswers(text) {
  const headRe = /(?:参考答案|答案与解析|答案解析|答案速查|答案|Answer\s*Keys?|Answers?(?!\s*(?:Sheet|the|each|all|for)\b))/i;

  // 紧凑字符 -> 原文索引 映射
  const mapArr = [];
  let compact = '';
  for (let i = 0; i < text.length; i++) {
    if (!/\s/.test(text[i])) { compact += text[i]; mapArr.push(i); }
  }

  const candidates = [];
  let ci = 0;
  while (ci < compact.length) {
    const hit = compact.slice(ci).search(headRe);
    if (hit < 0) break;
    const cs = ci + hit;
    ci = cs + 1;
    if (cs < compact.length * 0.2) continue;
    const oi = mapArr[cs];
    if (oi === undefined) continue;
    if (!candidates.includes(oi)) candidates.push(oi);
  }
  candidates.sort((a, b) => a - b);

  let cut = -1;
  for (const idx of candidates) {
    const chunk = text.slice(idx, idx + 4000);
    if (looksLikeAnswerList(chunk)) { cut = idx; break; }
  }
  if (cut < 0 && text.length > 3000) {
    const from = text.length - 3000;
    if (looksLikeAnswerList(text.slice(from))) cut = from;
  }
  if (cut < 0) return { body: text, answers: {} };

  // 从答案块前面最近的一行开头开始删，避免残留半行
  let lineStart = text.lastIndexOf('\n', cut - 1) + 1;
  if (lineStart < 0 || cut - lineStart > 200) lineStart = cut;
  return {
    body: text.slice(0, lineStart),
    answers: parseAnswerPairs(text.slice(cut))
  };
}

/* ===================== 阅读部分定位 ===================== */
function stripDirections(t) {
  const m = /Answer\s*Sheet\s*\d?/i.exec(t.slice(0, 2500));
  if (!m) {
    const hd = /^Section\s*[ABC]\s*(?:Banked\s*Cloze|Long\s*Reading(?:\s*Matching)?|Careful\s*Reading|Passages)?[ \t]*\n?/i;
    return t.replace(hd, '').replace(/^\s*(?:选词填空|长篇阅读|仔细阅读)?\s*Directions?[^\n]*\n?/i, '').trim();
  }
  let rest = t.slice(m.index + m[0].length);
  rest = rest.replace(/^\s*\./, '');
  rest = rest.replace(/^\s*(?:(?:with|using)\s[^.\n]*\.)?\s*(?:You may not use[^.]*\.)?/i, '');
  return rest.trim();
}

function sliceReading(body) {
  let s = body.search(new RegExp(word('Part') + '\\s*I{3}\\b', 'i'));
  if (s < 0) s = body.search(new RegExp(W_READING, 'i'));
  if (s < 0) s = 0;
  let rest = body.slice(s);
  const e = rest.search(new RegExp(word('Part') + '\\s*I{1}V\\b', 'i'));
  if (e > 0) rest = rest.slice(0, e);
  return rest;
}

/* 关键修复：先按 Section 边界切，再各自 stripDirections。
   旧实现先 stripDirections 再解析，会在两篇仔细阅读之间把正文截断，导致 51-55 丢失。 */
function splitSections(rd) {
  const heads = [];
  const re = new RegExp(W_SECTION + '\\s*([ABC])\\b', 'gi');
  let m;
  while ((m = re.exec(rd))) heads.push({ ch: m[1].toUpperCase(), s: m.index, e: re.lastIndex });
  const kindOf = s => new RegExp(W_BANKED, 'i').test(s) ? 'cloze'
    : new RegExp(W_LONGREAD, 'i').test(s) ? 'match'
      : new RegExp(W_CAREFUL, 'i').test(s) ? 'read' : null;

  const pick = { A: null, B: null, C: null };
  heads.forEach(h => {
    const look = rd.slice(h.s, h.s + 160);
    const kind = kindOf(look);
    if (kind) {
      if (!pick.A && kind === 'cloze') pick.A = h;
      else if (!pick.B && kind === 'match') pick.B = h;
      else if (!pick.C && kind === 'read') pick.C = h;
    }
  });
  // 没有显式类型时，按出现顺序兜底（非重复出现）
  ['A', 'B', 'C'].forEach((ch, i) => {
    if (!pick[ch]) {
      const cand = heads.filter(h => h.ch === ch);
      if (cand.length) pick[ch] = cand[i < cand.length ? i : cand.length - 1];
    }
  });
  // 没有 Section 标记时，用中文标题兜底
  if (!pick.A && !pick.B && !pick.C) {
    const zh = [
      { ch: 'A', re: /选词填空/ }, { ch: 'B', re: /长篇阅读|段落匹配|信息匹配/ }, { ch: 'C', re: /仔细阅读/ }
    ];
    zh.forEach(z => {
      const mm = z.re.exec(rd);
      if (mm) pick[z.ch] = { ch: z.ch, s: mm.index, e: mm.index + mm[0].length };
    });
  }
  const starts = ['A', 'B', 'C'].filter(ch => pick[ch]).map(ch => ({ ch, i: pick[ch].s }))
    .sort((a, b) => a.i - b.i);
  const out = {};
  starts.forEach((cur, k) => {
    const end = k + 1 < starts.length ? starts[k + 1].i : rd.length;
    out[cur.ch] = rd.slice(cur.i, end);
  });
  return out;
}

function findSec(t, ch, from) {
  const ALT = { A: '选词填空', B: '长篇阅读|段落匹配|信息匹配', C: '仔细阅读' };
  const m = new RegExp(W_SECTION + '\\s*' + ch + '\\b|' + ALT[ch], 'i').exec(t.slice(from));
  return m ? from + m.index : -1;
}
function backDir(t, idx, floor) {
  const re = new RegExp(W_DIRECTIONS + '\\s*[:：]', 'gi');
  let m, best = -1;
  while ((m = re.exec(t)) && m.index < idx) {
    if (m.index >= Math.max(floor, idx - 1800)) best = m.index;
  }
  return best >= 0 ? best : idx;
}
function locate(rd) {
  const secs = splitSections(rd);
  let iA = secs.A ? rd.indexOf(secs.A) : findSec(rd, 'A', 0);
  let iB = secs.B ? rd.indexOf(secs.B) : findSec(rd, 'B', Math.max(iA + 1, 0));
  let iC = secs.C ? rd.indexOf(secs.C) : findSec(rd, 'C', Math.max(iA, iB) + 1);
  if (iC < 0) {
    const m = new RegExp(W_PASSAGE + '\\s+' + word('One') + '\\b|' + W_PASSAGE + '\\s+1\\b', 'i').exec(rd);
    if (m) iC = backDir(rd, m.index, Math.max(iB, iA, 0));
  }
  if (iB < 0) {
    const m = /\[A\]/.exec(rd);
    if (m && (iC < 0 || m.index < iC)) iB = backDir(rd, m.index, Math.max(iA, 0));
  }
  if (iA < 0) {
    const end = iB >= 0 ? iB : (iC >= 0 ? iC : -1);
    const head = end > 0 ? rd.slice(0, end) : '';
    if (head && /_{2,}/.test(head) && /\bK\)\s*[A-Za-z]/.test(head)) iA = 0;
  }
  return [iA, iB, iC];
}

/* ===================== 段落切分 ===================== */
function paragraphs(text, isPdf) {
  const lines = String(text || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (!isPdf) return lines;
  const lens = lines.map(l => l.length).sort((a, b) => a - b);
  const ref = lens[Math.floor(lens.length * 0.8)] || 80;
  const out = [];
  let cur = '', prev = '';
  lines.forEach(l => {
    if (!cur) { cur = l; prev = l; return; }
    const np = /^\[[A-N]\]/.test(l)
      || (/[.!?"]$/.test(prev) && prev.length < ref * 0.75)
      || (out.length === 0 && cur === prev && prev.length < ref * 0.6 && !/[.!?,;:]$/.test(prev));
    if (np) { out.push(cur); cur = l; } else cur += ' ' + l;
    prev = l;
  });
  if (cur) out.push(cur);
  return out;
}

/* ===================== 题号序列 ===================== */
/* 行首题号，允许 "[26]" 形式；返回去重后按题号升序的数组 */
function seqNumbered(t, from) {
  const re = /(?:^|\n)[ \t]*\[?[ \t]*(\d{1,2})[ \t]*\]?[ \t]*[.、)]?(?=[ \t]*(?:[A-Z(]|\S))/g;
  re.lastIndex = from || 0;
  const ms = [];
  let m;
  while ((m = re.exec(t))) {
    const n = +m[1];
    if (n >= 1 && n <= 99) ms.push({ n, s: m.index, e: re.lastIndex });
  }
  const last = {};
  ms.forEach(x => { last[x.n] = x; });
  const uniq = Object.values(last).sort((a, b) => a.n - b.n);
  let i = 0;
  for (; i < uniq.length - 1; i++) if (uniq[i + 1].n === uniq[i].n + 1) break;
  if (i >= uniq.length - 1) return [];
  const out = [uniq[i]];
  for (let j = i + 1; j < uniq.length; j++) {
    if (uniq[j].n === out[out.length - 1].n + 1) out.push(uniq[j]);
  }
  return out;
}

/* 在指定题号区间内取题号（更稳，避免文章中数字误判） */
function seqInRange(t, lo, hi) {
  const all = seqNumbered(t, 0).filter(x => x.n >= lo && x.n <= hi);
  const last = {};
  all.forEach(x => { last[x.n] = x; });
  return Object.values(last).sort((a, b) => a.n - b.n);
}

/* ===================== 选项构建 ===================== */
function optText(t, pos, nextPos) {
  let s = t.slice(pos, nextPos === undefined ? t.length : nextPos);
  s = s.replace(/^[ \t]*([A-D])[ \t]*[).:：、][ \t]*/i, '');
  return clean(s);
}
function buildChoice(no, seg, letterSpec) {
  const allow = letterSpec || /[A-D]/;
  const re = /(?:^|\n)[ \t]*([A-D])[ \t]*[).:：、][ \t]*(?=[A-Za-z"'([])/g;
  const marks = [];
  let m, need = 0;
  const order = ['A', 'B', 'C', 'D'];
  while ((m = re.exec(seg))) {
    if (m[1] === order[need] && allow.test(m[1])) {
      marks.push({ k: order[need], s: m.index, e: re.lastIndex });
      need++;
      if (need === 4) break;
    }
  }
  const opts = marks.length
    ? marks.map((x, i) => ({ k: x.k, t: optText(seg, x.s, marks[i + 1] ? marks[i + 1].s : seg.length) }))
    : (letterSpec ? [{ k: '?', t: '' }] : []);
  return { no, text: clean(marks.length ? seg.slice(0, marks[0].s) : seg), opts };
}

/* ===================== Section A 选词填空 ===================== */
/* 去掉 Directions 说明段：只在字段内找句号，避免贪婪跨段吃正文 */
function stripDirectionsText(t) {
  let s = String(t || '');
  s = s.replace(new RegExp('^[\\s\\S]*?' + W_SECTION + '\\s*[A-C]\\b[^\\n]*\\n', 'i'), '');
  const dm = new RegExp('^[\\s\\S]*?' + W_DIRECTIONS + '\\s*[:：]', 'i').exec(s);
  if (dm) {
    const rest = s.slice(dm[0].length);
    const dot = rest.search(/[.。]\s*(?:\n|$)/);
    s = dot >= 0 ? rest.slice(dot + 1) : rest;
  }
  return s.replace(new RegExp('^' + W_DIRECTIONS + '\\s*[:：][^\\n]*\\n?', 'i'), '').trim();
}

/* 词库：兼容「A) word」逐行排列，也兼容整段挤在一行（"A) appeal B) extravagantly ..."），
   以及字母与单词被换行拆开的情况。取最长的连续字母序列。 */
function parseBank(t) {
  const re = /(?:^|[\s(（])([A-O])[ \t]*[).:：、][ \t]*([A-Za-z][A-Za-z'\-]{0,24})/g;
  const toks = [];
  let m;
  while ((m = re.exec(t))) toks.push({ k: m[1], w: m[2], s: m.index, e: re.lastIndex });

  // 字母与单词被换行拆开：找「单独一行的 A)」再看下一行的单词
  const lines = t.split('\n');
  let off = 0;
  for (let i = 0; i < lines.length; i++) {
    const lm = /^[ \t]*([A-O])[ \t]*[).:：、][ \t]*$/.exec(lines[i]);
    if (lm && i + 1 < lines.length && /^[A-Za-z][A-Za-z'\-]*$/.test(lines[i + 1].trim())) {
      toks.push({ k: lm[1], w: lines[i + 1].trim(), s: off + lm.index, e: off + lines[i].length });
    }
    off += lines[i].length + 1;
  }
  toks.sort((a, b) => a.s - b.s);

  let best = [], cur = [];
  let need = 'A';
  toks.forEach(x => {
    if (x.k === need) { cur.push(x); need = String.fromCharCode(need.charCodeAt(0) + 1); }
    else if (x.k === 'A') { if (cur.length > best.length) best = cur; cur = [x]; need = 'B'; }
  });
  if (cur.length > best.length) best = cur;

  const seen = {};
  const bank = best.filter(x => { if (seen[x.k]) return false; seen[x.k] = 1; return true; })
    .map(x => ({ k: x.k, t: x.w }));
  return bank.length >= 8 ? bank : [];
}

function parseCloze(t, isPdf) {
  const bank = parseBank(t);
  let bodyStart = t.length;
  if (bank.length) {
    const first = new RegExp('(?:^|\\n)[ \\t]*' + bank[0].k + '[ \\t]*[).:：、]');
    const m = first.exec(t);
    if (m) bodyStart = m.index;
  }
  let body = stripDirectionsText(t.slice(0, bodyStart));
  body = body.replace(/^[ \t]*(?:选词填空|Banked\s*Cloze)[ \t]*\n?/i, '').trim();

  const found = [];
  const push = n => { if (!found.includes(n)) found.push(n); };

  // (1) 裸数字：本套 PDF 里题号常单独成行（"26" 一行），优先处理
  {
    const flat = body.replace(/\s+/g, ' ');
    const nums = [];
    const re = /(?<![\d.\w])(\d{1,2})(?![\d\w])/g;
    let m;
    while ((m = re.exec(flat))) nums.push({ n: +m[1], s: m.index, e: re.lastIndex });
    let best = [];
    for (let i = 0; i < nums.length; i++) {
      if (nums[i].n < 20 || nums[i].n > 45) continue;
      const seq = [nums[i]];
      let exp = nums[i].n + 1;
      for (let j = i + 1; j < nums.length; j++) {
        if (nums[j].n === exp) { seq.push(nums[j]); exp++; }
      }
      if (seq.length > best.length) best = seq;
    }
    if (best.length >= 8) {
      best.forEach(x => push(x.n));
      let tx = '', cursor = 0;
      best.forEach(x => { tx += flat.slice(cursor, x.s) + ' [[' + x.n + ']] '; cursor = x.e; });
      body = tx + flat.slice(cursor);
    }
  }

  // (2) 下划线 + 题号
  let text = body
    .replace(/_{2,}[ \t]*(\d{1,2})[ \t]*_{2,}/g, (all, n) => { push(+n); return ' [[' + n + ']] '; })
    .replace(/(?:^|[\s(])(\d{1,2})[ \t]*_{2,}/g, (all, n) => { push(+n); return ' [[' + n + ']] '; })
    .replace(/_{2,}[ \t]*(\d{1,2})\b/g, (all, n) => { push(+n); return ' [[' + n + ']] '; });

  // (3) 方/圆括号题号（2026 版式：[26]）——独立判断
  text = text.replace(/[\[(][ \t]*(\d{1,2})[ \t]*[\])]/g, (all, n) => { push(+n); return ' [[' + n + ']] '; });

  const nos = found.filter(n => n >= 1 && n <= 99).sort((a, b) => a - b);
  if (!nos.length) return null;

  const passageRaw = text.replace(/\[\[(\d+)\]\]/g, ' ⟦$1⟧ ');
  let questionNos = nos.slice();
  const lo = questionNos[0];
  const ranged = questionNos.filter(n => n >= lo && n <= lo + 9);
  if (ranged.length >= 8) questionNos = ranged;

  return {
    type: 'cloze', title: '选词填空', short: '选词填空',
    blocks: [{
      passage: paragraphs(passageRaw, isPdf),
      bank,
      questions: questionNos.map(no => ({ no, text: '', opts: bank.map(b => ({ k: b.k, t: b.t })) }))
    }]
  };
}

/* ===================== Section B 长篇阅读（段落匹配） ===================== */
/* 找段落标记：支持 [A] 与行首 "A)"（字母常单独成行），返回按位置排序的标记列表 */
function findParaMarks(t) {
  const out = [];
  let m;
  const br = /\[[ \t]*([A-N])[ \t]*\]/g;
  while ((m = br.exec(t))) out.push({ k: m[1], s: m.index, e: br.lastIndex, bracket: true });
  if (out.length >= 8) return { marks: out, bracket: true };

  const out2 = [];
  const lineRe = /(?:^|\n)[ \t]*([A-N])(?![A-Za-z])[ \t]*([).:：、])[ \t]*/g;
  while ((m = lineRe.exec(t))) {
    const afterIdx = m.index + m[0].length;
    const rest = t.slice(afterIdx);
    // 标记后应当换行，或紧跟正文（不能是 "A) B)" 这种选项罗列）
    const okLineEnd = /^[ \t]*(?:\n|$)/.test(rest);
    const okText = /^[A-Za-z"'([]/.test(rest);
    if (!okLineEnd && !okText) continue;
    if (/^[ \t]*[A-N][ \t]*[).:：、]/.test(rest)) continue;
    out2.push({ k: m[1], s: m.index + (m[0][0] === '\n' ? 1 : 0), e: afterIdx, bracket: false });
  }
  if (out2.length > out.length) return { marks: out2, bracket: false };
  return { marks: out, bracket: true };
}

function parseMatch(t, isPdf) {
  const found = findParaMarks(t);
  const marks = found.marks;
  if (marks.length < 3) return null;
  let m;

  // 段落区域 = 第一个标记 到 最后一个标记所在段落结束
  const paraStart = marks[0].s;
  // 段落正文里若混入题号行（36.），在此截断
  const qLine = new RegExp('(?:^|\\n)[ \\t]*(\\d{1,2})[ \\t]*[.、)]', 'g');
  qLine.lastIndex = paraStart;
  let qm, paraEnd = t.length;
  while ((qm = qLine.exec(t))) {
    if (qm.index > paraStart) { paraEnd = qm.index; break; }
  }

  const inPara = marks.filter(mk => mk.s < paraEnd);
  const parts = inPara.map((mk, i, arr) => {
    const end = (i + 1 < arr.length) ? arr[i + 1].s : paraEnd;
    const body = clean(t.slice(mk.e, end));
    // 统一带上 [X] 标签，便于 UI 显示段落号与"原文"跳转
    return found.bracket ? body : ('[' + mk.k + '] ' + body);
  }).filter(s => s.length > 0);

  // 题干：段落区域之外的 36-45（靠前靠后都认）
  const outside = t.slice(0, paraStart) + '\n' + t.slice(paraEnd);
  let src = outside;
  let st = seqInRange(outside, 30, 60);
  if (st.length < 5) { src = t; st = seqInRange(t, 30, 60); }
  if (!st.length) return null;
  const letters = marks.map(x => x.k);
  const qs = st.map((x, i) => ({
    no: x.n,
    text: clean(src.slice(x.e, st[i + 1] ? st[i + 1].s : src.length)),
    opts: letters.map(k => ({ k, t: '' }))
  }));
  return { type: 'match', title: '长篇阅读', short: '长篇阅读', blocks: [{ passage: parts, questions: qs }] };
}

/* ===================== Section C 仔细阅读 ===================== */
function parseRead(t, isPdf) {
  const ORD = '(' + word('One') + '|' + word('Two') + '|' + word('Three') + '|1|2|3)';
  const pr = new RegExp(W_PASSAGE + '\\s*' + ORD + '\\b', 'gi');
  const idx = [];
  let m;
  while ((m = pr.exec(t))) {
    if (!idx.length || m.index > idx[idx.length - 1]) idx.push(m.index);
  }
  const chunks = idx.length
    ? idx.map((s, i) => t.slice(s, i + 1 < idx.length ? idx[i + 1] : t.length))
    : [t];

  const blocks = [];
  chunks.forEach(c => {
    c = c.replace(new RegExp('^' + W_PASSAGE + '\\s*' + ORD + '[^\\n]*\\n?', 'i'), '')
      .replace(new RegExp(word('Questions') + '?\\s*\\d+\\s*(?:' + word('to') + '|-|–)\\s*\\d+\\s*' + word('are') + '\\s*' + word('based') + '\\s*' + word('on') + '[^.\\n]*\\.?', 'i'), '')
      .replace(new RegExp('^[ \\t]*' + W_SECTION + '\\s*C[^\\n]*\\n?', 'i'), '')
      .replace(/^[ \t]*仔细阅读[ \t]*\n?/i, '')
      .trim();
    c = stripDirectionsText(c);
    const sq = seqInRange(c, 40, 60);
    if (!sq.length) return;
    const passage = paragraphs(c.slice(0, sq[0].s), isPdf);
    const questions = sq.map((x, i) => buildChoice(x.n, c.slice(x.e, sq[i + 1] ? sq[i + 1].s : c.length)));
    blocks.push({ passage, questions });
  });
  if (!blocks.length) return null;
  return { type: 'read', title: '仔细阅读', short: '仔细阅读', blocks };
}

/* ===================== 整卷解析 ===================== */
function parsePaper(raw, isPdf) {
  const text = stripNoise(norm(raw));
  const { body, answers } = extractAnswers(text);
  const rd = sliceReading(body);
  const secs = splitSections(rd);
  const [iA, iB, iC] = locate(rd);
  const all = [iA, iB, iC].filter(x => x >= 0).sort((a, b) => a - b);
  const endOf = i => {
    const n = all.filter(x => x > i)[0];
    return n === undefined ? rd.length : n;
  };

  const sections = [], warns = [];
  if (secs.A) {
    const s = parseCloze(secs.A, isPdf);
    s ? sections.push(s) : warns.push('没有识别到选词填空的空格（26-35）');
  } else {
    warns.push('没有找到选词填空 Section A，这部分没有导入');
  }
  if (secs.B) {
    const s = parseMatch(secs.B, isPdf);
    s ? sections.push(s) : warns.push('没有识别到长篇阅读的段落标记（A-K）或题干（36-45）');
  } else {
    warns.push('没有找到长篇阅读 Section B，这部分没有导入');
  }
  if (secs.C) {
    const s = parseRead(secs.C, isPdf);
    s ? sections.push(s) : warns.push('没有识别到仔细阅读的题目（46-55）');
  } else {
    warns.push('没有找到仔细阅读 Section C，这部分没有导入');
  }
  if (!sections.length) {
    const s = parseRead(rd, isPdf);
    if (s) {
      sections.push(s);
      warns.push('没找到 Section A/B/C 标记，已整体按阅读题解析');
    }
  }

  // 题号不能重复（同一题出现两次只保留第一次）
  const seen = {};
  let dup = 0;
  sections.forEach(sec => sec.blocks.forEach(b => {
    b.questions = b.questions.filter(q => {
      if (seen[q.no]) { dup++; return false; }
      seen[q.no] = 1; return true;
    });
  }));
  if (dup) warns.push('有 ' + dup + ' 个重复题号已自动去重');

  // 绑定答案
  let total = 0, missing = 0;
  const missingNos = [];
  sections.forEach(sec => sec.blocks.forEach(b => b.questions.forEach(q => {
    total++;
    q.ans = answers[q.no] || null;
    q.type = sec.type;
    if (!q.ans) { missing++; missingNos.push(q.no); }
  })));

  const expLo = 26, expHi = 55, expCount = 30;
  const nums = Object.keys(seen).map(Number).sort((a, b) => a - b);
  const inRange = nums.filter(n => n >= expLo && n <= expHi);
  const gaps = [];
  for (let n = expLo; n <= expHi; n++) if (!seen[n]) gaps.push(n);
  if (gaps.length && gaps.length <= 30) warns.push('缺少题号：' + gaps.join('、'));
  if (total !== expCount) warns.push('题目数量为 ' + total + ' 题，标准应为 ' + expCount + ' 题（26-55）');

  return {
    sections, warns, total, missing, missingNos, gaps,
    answersFound: Object.keys(answers).length,
    nums: inRange, ok: total === expCount && gaps.length === 0
  };
}

const IRREGULAR = {

  children: 'child', men: 'man', women: 'woman', people: 'person',
  feet: 'foot', teeth: 'tooth', mice: 'mouse', geese: 'goose',
  lives: 'life', wives: 'wife', knives: 'knife', halves: 'half',
  data: 'datum', criteria: 'criterion', phenomena: 'phenomenon',
  media: 'medium', analyses: 'analysis', bases: 'basis', crises: 'crisis',
  better: 'good', best: 'good', worse: 'bad', worst: 'bad', more: 'much', most: 'much'
};

function lemmatize(w) {
  if (!w) return w;
  const raw = String(w);
  const low = raw.toLowerCase();
  if (low.length <= 2) return low;
  if (IRREGULAR[low]) return IRREGULAR[low];
  if (/(ss|us|is)$/.test(low)) return low;
  if (/ies$/.test(low) && low.length > 4) return low.slice(0, -3) + 'y';
  if (/(ches|shes|sses|xes|zes)$/.test(low)) return low.slice(0, -2);
  if (/s$/.test(low) && !/ss$/.test(low)) return low.slice(0, -1);
  if (/ying$/.test(low) && low.length > 5) return low.slice(0, -4) + 'ie';
  if (/ing$/.test(low) && low.length > 5) {
    let base = low.slice(0, -3);
    if (/([b-df-hj-np-tv-z])\1$/.test(base)) base = base.slice(0, -1);
    return base;
  }
  if (/ied$/.test(low) && low.length > 4) return low.slice(0, -3) + 'y';
  if (/ed$/.test(low) && low.length > 4) {
    let base = low.slice(0, -2);
    if (/([b-df-hj-np-tv-z])\1$/.test(base)) base = base.slice(0, -1);
    if (!/[aeiou]$/.test(base) && /[^aeiou]{2}$/.test(base)) base = base;
    return base;
  }
  if (/ly$/.test(low) && low.length > 4) return low.slice(0, -2);
  return low;
}

/* ===================== 智能识别（识别不出就"未分类"，绝不猜） ===================== */
function detectLanguage(text, name) {
  const s = String(name || '') + '\n' + String(text || '').slice(0, 4000);
  const kana = (s.match(/[\u3040-\u309f\u30a0-\u30ff]/g) || []).length;
  const han = (s.match(/[\u4e00-\u9fff]/g) || []).length;
  const latin = (s.match(/[A-Za-z]/g) || []).length;
  const total = kana + han + latin;
  if (total < 30) return '未分类';
  if (kana > 20) return '日语';
  if (latin > han * 3) return '英语';
  if (han > latin * 3) return '中文';
  if (/[àâçéèêëîïôûùüÿœæ]/i.test(s)) return '法语';
  if (/[äöüß]/i.test(s)) return '德语';
  if (/[áéíóúñ¿¡]/i.test(s)) return '西班牙语';
  return '未分类';
}

function detectExam(text, name) {
  const s = (String(name || '') + '\n' + String(text || '').slice(0, 3000));
  const up = s.toUpperCase();
  if (/CET[\s\-–—]?6|大学英语六级|六级考试/.test(up) || /六级/.test(s)) return 'CET-6';
  if (/CET[\s\-–—]?4|大学英语四级|四级考试/.test(up) || /四级/.test(s)) return 'CET-4';
  if (/IELTS|雅思/.test(up)) return 'IELTS';
  if (/TOEFL|托福/.test(up)) return 'TOEFL';
  if (/JLPT|日本语能力测试/.test(up)) return 'JLPT';
  if (/\bGRE\b/.test(up)) return 'GRE';
  return '';
}

function detectLevel(text, name, exam) {
  const s = String(name || '') + '\n' + String(text || '').slice(0, 3000);
  const n = /\b(N[1-5])\b/i.exec(s);
  if (n) return n[1].toUpperCase();
  if (exam === 'IELTS') {
    const b = /\b([0-9](?:\.[05])?)\s*(?:分)?\s*(?:band)?/i.exec(s);
    if (b && +b[1] <= 9) return b[1];
  }
  return '';
}

function detectMeta(name, text) {
  const s = String(name || '') + '\n' + String(text || '').slice(0, 3000);
  const exam = detectExam(text, name);
  const language = detectLanguage(text, name);
  const ym = /(20\d{2})\s*[年\-\/.]\s*(\d{1,2})\s*月?/.exec(s);
  let year = '', month = '';
  if (ym) { year = ym[1]; month = String(+ym[2]); }
  else {
    const y = /\b(20\d{2})\b/.exec(s);
    if (y) year = y[1];
  }
  const sm = /第\s*([一二三四五六1-6])\s*套/.exec(s);
  const setMap = { '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6' };
  const set = sm ? (setMap[sm[1]] || sm[1]) : '';

  let type = '';
  if (/真题|全真试题/.test(s)) type = '真题';
  else if (/模拟/.test(s)) type = '模拟题';
  else if (/练习|习题/.test(s)) type = '练习';

  return { language, exam, level: detectLevel(text, name, exam), year, month, set, type, source: '' };
}

function buildLabel(meta, name) {
  const parts = [];
  if (meta.language && meta.language !== '未分类') parts.push(meta.language);
  if (meta.exam) parts.push(meta.exam);
  if (meta.level) parts.push(meta.level);
  if (meta.year) parts.push(meta.year + '年' + (meta.month ? meta.month + '月' : ''));
  if (meta.set) parts.push('第' + meta.set + '套');
  if (!parts.length && name) return String(name).replace(/\.[a-z0-9]+$/i, '');
  return parts.join(' ') || '未分类资料';
}

/* ===================== 文件读取 ===================== */
function readAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('文件读取失败'));
    fr.readAsArrayBuffer(file);
  });
}
function readAsText(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('文件读取失败'));
    fr.readAsText(file, 'utf-8');
  });
}

/* PDF：按坐标聚合成行，再按间距判断空格与段落（不要直接拼 getTextContent）
   重要：在 file:// 打开时，浏览器的 Worker 会被安全策略拦掉，
   所以这里默认 **不用 worker**（disableWorker），否则会静默失败。 */
async function pdfToText(file, onProgress) {
  const say = m => { try { onProgress && onProgress(m); } catch (e) {} };
  if (typeof pdfjsLib === 'undefined') {
    throw new Error('PDF 组件没有加载成功（pdf.js 需要联网从 CDN 下载）。请检查网络，或改用「粘贴文字」。');
  }
  const buf = await readAsArrayBuffer(file);
  say('开始解析 PDF（' + (buf.byteLength / 1024 / 1024).toFixed(1) + ' MB）…');

  let pdf = null, lastErr = null;
  const attempts = [
    { name: '主线程模式', opt: { data: buf, disableWorker: true } },
    { name: 'Worker 模式', opt: { data: buf } }
  ];
  for (const a of attempts) {
    try {
      say('正在解析（' + a.name + '）…');
      pdf = await pdfjsLib.getDocument(a.opt).promise;
      break;
    } catch (e) {
      lastErr = e;
      say(a.name + '失败：' + (e && e.message ? e.message : e));
    }
  }
  if (!pdf) {
    lastErrorDetail = String((lastErr && lastErr.message) || lastErr || '');
    throw new Error('无法打开这个 PDF：' + lastErrorDetail);
  }

  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    if (p === 1 || p % 5 === 0 || p === pdf.numPages) say('正在提取文字：第 ' + p + ' / ' + pdf.numPages + ' 页…');
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      const x = it.transform[4], y = it.transform[5];
      const w = it.width || 0;
      let row = null;
      for (const r of rows) {
        if (Math.abs(r.y - y) < 3) { row = r; break; }
      }
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, w, s: it.str });
    });
    rows.sort((a, b) => b.y - a.y);
    const lens = rows.map(r => r.items.reduce((n, i) => n + i.s.length, 0)).sort((a, b) => a - b);
    const ref = lens[Math.floor(lens.length * 0.8)] || 70;
    const lines = [];
    rows.forEach(r => {
      r.items.sort((a, b) => a.x - b.x);
      let line = '', prevEnd = null;
      r.items.forEach(it => {
        if (prevEnd !== null) {
          const gap = it.x - prevEnd;
          if (gap > 1.2 && !/\s$/.test(line) && !/^\s/.test(it.s)) line += ' ';
        }
        line += it.s;
        prevEnd = it.x + (it.w || 0);
      });
      line = line.replace(/\s+/g, ' ').trim();
      if (line) lines.push({ s: line, len: line.length, ref });
    });
    let out = '';
    lines.forEach((l, i) => {
      out += l.s;
      const next = lines[i + 1];
      const shortEnd = /[.!?"']$/.test(l.s) && l.len < l.ref * 0.75;
      out += (shortEnd || !next) ? '\n\n' : '\n';
    });
    pages.push(out);
  }
  if (!pages.join('').trim()) throw new Error('这个 PDF 没有可提取的文字（可能是扫描版，也就是整页都是图片）');
  say('PDF 解析完成，正在识别题目…');
  return pages.join('\n');
}

async function docxToText(file) {
  if (typeof mammoth === 'undefined') throw new Error('DOCX 组件未加载（需要联网加载 mammoth.js）');
  const buf = await readAsArrayBuffer(file);
  const res = await mammoth.extractRawText({ arrayBuffer: buf });
  return res.value || '';
}

async function readAnyFile(file, onProgress) {
  const n = (file.name || '').toLowerCase();
  if (n.endsWith('.pdf')) return { text: await pdfToText(file, onProgress), isPdf: true };
  if (n.endsWith('.docx')) return { text: await docxToText(file), isPdf: false };
  if (n.endsWith('.txt') || n.endsWith('.md')) return { text: await readAsText(file), isPdf: false };
  const t = await readAsText(file);
  if (t && t.trim()) return { text: t, isPdf: false };
  throw new Error('不支持的文件格式：' + file.name);
}

/* ===================== 答案合并（关键：用户手填必须覆盖） ===================== */
function applyAnswers(paper, text) {
  const qs = allQuestions(paper);
  if (!qs.length) return { applied: 0, total: 0, missing: [] };
  const t = norm(text).toUpperCase();
  let pairs = {};
  if (!/\d/.test(t)) {
    // 只有字母：按题号顺序依次对应（答案字母可能是 P/Q/R 等，放开到 A-Z）
    const ls = t.replace(/[^A-Z]/g, '').split('');
    qs.forEach((q, i) => { if (ls[i]) pairs[q.no] = ls[i]; });
  } else {
    pairs = parseAnswerPairs(t);
  }
  let applied = 0;
  qs.forEach(q => {
    const v = pairs[q.no];
    if (v) { q.ans = v; applied++; }     // 用户输入的答案一律覆盖
  });
  const missing = qs.filter(q => !q.ans).map(q => q.no);
  return { applied, total: qs.length, missing };
}
/* 跳回原文：匹配题跳到正确段落，其他题跳到文章开头 */
function jumpToAnswer(no) {
  const s = session;
  if (!s) return;
  const q = s.qmap[no];
  if (!q) return;
  let el = null;
  if (q.type === 'cloze') {
    el = document.getElementById('blank-' + no);
  } else if (q.type === 'match') {
    // 用正确答案定位段落（不是用用户选的那个）
    const label = q.ans || s.answers[no];
    if (label) el = document.getElementById('para-' + label);
  }
  if (!el) {
    const firstPane = document.querySelector('.pane.passage');
    if (firstPane) firstPane.scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast(q.type === 'match' && !q.ans ? '这题没有答案，无法定位到段落' : '已跳到文章开头');
    return;
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('hl');
  setTimeout(() => el.classList.remove('hl'), 1800);
}

function buildTree(list) {
  const tree = {};
  list.forEach(p => {
    const lang = p.language || '未分类';
    const exam = p.exam || '未分类考试';
    tree[lang] = tree[lang] || {};
    tree[lang][exam] = tree[lang][exam] || [];
    tree[lang][exam].push(p);
  });
  return tree;
}

function renderTree(tree) {
  let h = '<div class="tree">';
  Object.keys(tree).sort().forEach(lang => {
    h += `<div class="tree-lang"><div class="tl">${esc(lang)}</div>`;
    Object.keys(tree[lang]).sort().forEach(exam => {
      h += `<div class="tree-exam"><div class="te">${esc(exam)}</div><div class="tree-items">`;
      tree[lang][exam].sort((a, b) => (b.created || 0) - (a.created || 0)).forEach(p => {
        const total = countQuestions(p), ans = countAnswered(p);
        const miss = total > ans;
        h += `<button class="ti${miss ? ' miss' : ''}" data-act="detail" data-id="${esc(p.id)}">
          ${esc(p.label)}<i>${total} 题 · 答案 ${ans}/${total}${miss ? ' ⚠' : ''}</i></button>`;
      });
      h += '</div></div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

let viewId = null;

function clozeHTML(b) {
  const s = session;
  const bank = b.bank || [];
  const used = {};
  Object.keys(s.answers).forEach(no => {
    const q = s.qmap[no];
    if (q && q.type === 'cloze') used[s.answers[no]] = no;
  });
  const pills = bank.map(o => `<button class="pill${used[o.k] ? ' used' : ''}" data-act="bank" data-k="${esc(o.k)}"><b>${esc(o.k)}</b>${esc(o.t)}</button>`).join('');
  const rows = b.questions.map(q => {
    const a = s.answers[q.no];
    const word = a ? ((q.opts.find(o => o.k === a) || {}).t || '') : '';
    let cls = 'brow', extra = '';
    if (s.submitted) {
      const ok = a === q.ans;
      cls += ok ? ' ok' : ' no';
      if (!ok) extra = `<span class="fix">${q.ans ? '正确：' + q.ans + '） ' + esc(((q.opts.find(o => o.k === q.ans) || {}).t || '')) : '文档中没有答案'}</span>`;
    } else if (s.active === q.no) cls += ' act';
    const jump = s.submitted ? `<button class="jump-btn" data-act="jump" data-no="${q.no}">原文</button>` : '';
    return `<div class="${cls}" id="row-${q.no}" data-act="blankRow" data-no="${q.no}">
      <span class="n">${q.no}</span><span class="val">${word ? esc(a + '） ' + word) : '——'}</span>${extra}${jump}</div>`;
  }).join('');
  return `<p class="hint">先点题号（或文中的空），再点下面的单词填入。</p>
    <div class="bank">${pills}</div>${rows}`;
}

function qHTML(q, sec) {
  const s = session, a = s.answers[q.no], sub = s.submitted;
  const jump = sub ? `<button class="jump-btn" data-act="jump" data-no="${q.no}">原文</button>` : '';
  let h = `<div class="q" id="q-${q.no}"><div class="stem"><span class="n">${q.no}</span>${q.text ? rich(q.text) : ''}${jump}</div>`;
  const cls = k => {
    let c = a === k ? ' sel' : '';
    if (sub) {
      if (k === q.ans) c += ' right';
      else if (a === k) c += ' wrong';
    }
    return c;
  };
  if (sec.type === 'match') {
    h += '<div class="letters">' + q.opts.map(o => `<button class="lt${cls(o.k)}" data-act="pick" data-no="${q.no}" data-k="${esc(o.k)}">${esc(o.k)}</button>`).join('') + '</div>';
  } else {
    h += '<div class="opts">' + q.opts.map(o => `<button class="opt${cls(o.k)}" data-act="pick" data-no="${q.no}" data-k="${esc(o.k)}"><b>${esc(o.k)}</b><span>${esc(o.t)}</span></button>`).join('') + '</div>';
  }
  if (sub) {
    if (!q.ans) h += '<div class="status na">文档中没有找到这题的答案，不计分</div>';
    else if (!a) h += `<div class="status na">未作答，正确答案 ${esc(q.ans)}</div>`;
    else if (a === q.ans) h += '<div class="status ok">答对了</div>';
    else h += `<div class="status no">答错了，正确答案 ${esc(q.ans)}</div>`;
  }
  return h + '</div>';
}

function blockHTML(sec, b) {
  const passage = (b.passage || []).map(p => {
    if (sec.type === 'match') {
      const mm = /^\[([A-N])\]\s*/.exec(p);
      if (mm) return `<p id="para-${mm[1]}"><span class="pm">${mm[1]}</span>${rich(p.slice(mm[0].length))}</p>`;
    }
    return `<p>${rich(p)}</p>`;
  }).join('');
  const right = sec.type === 'cloze' ? clozeHTML(b) : b.questions.map(q => qHTML(q, sec)).join('');
  return `<div class="cols"><article class="pane passage">${passage || '<p class="muted">（没有提取到文章）</p>'}</article><div class="pane">${right}</div></div>`;
}

  return h;
}

/* ===================== 生词本 ===================== */
function dueWords() {
  const now = Date.now();
  return vocab.filter(v => !v.mastered && (!v.nextReview || v.nextReview <= now));
}
function allActiveVocab() { return vocab.filter(v => !v.mastered); }

/* ===================== 复习页 ===================== */
function makeBlankedSentence(sentence, word) {
  if (!sentence) return '';
  const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w{0,3}\\b', 'gi');
  let done = false;
  const out = sentence.replace(re, m => {
    if (done) return m;
    done = true;
    return '<u>' + '_'.repeat(Math.max(4, m.length)) + '</u>';
  });
  if (!done) {
    const re2 = new RegExp('\\w*' + word.slice(0, Math.max(3, word.length - 2)) + '\\w*', 'i');
    return sentence.replace(re2, m => '<u>' + '_'.repeat(Math.max(4, m.length)) + '</u>');
  }
  return out;
}

function reviewHTML() {
  const s = session;
  if (!s || !s.review) return '<section class="card"><h2>今日复习</h2><p class="empty">没有正在进行的复习。</p><div class="btns"><button class="primary" data-act="nav" data-view="vocab">返回生词本</button></div></section>';
  const v = s.reviewList[s.reviewIndex];
  if (!v) {
    return `<section class="card"><h2>今日复习完成</h2>
      <p class="muted">本轮复习了 ${s.reviewList.length} 个词。</p>
      <div class="btns"><button class="primary" data-act="nav" data-view="vocab">返回生词本</button>
      <button class="ghost" data-act="startReview">再复习一轮</button></div></section>`;
  }
  const blanked = makeBlankedSentence(v.sentence || '', v.w);
  const meaning = v.meaning ? esc(v.meaning) : '<span class="empty-m">释义待补充（可在生词本里填）</span>';
  const stage = s.stage || 'input';
  let answerHTML = '';
  if (stage === 'done') {
    const ok = s.resultFlash === 'ok';
    answerHTML = `<div class="review-answer ${ok ? 'ok' : 'no'}">${ok ? '✓ 拼写正确' : '✗ 正确拼写：' + esc(v.w)}</div>`;
  }
  let actions;
  if (stage === 'input') {
    actions = `<div class="review-actions"><button class="primary" data-act="reviewSubmit">提交</button><button class="ghost" data-act="reviewSkip">跳过</button></div>`;
  } else {
    actions = `<p class="mini" style="margin-top:10px">凭你的记忆判断：</p>
      <div class="review-actions">
        <button class="rec" data-act="rate" data-rate="again">不认识</button>
        <button class="rec" data-act="rate" data-rate="hard">模糊</button>
        <button class="rec" data-act="rate" data-rate="good">认识</button>
      </div>`;
  }
  const inputCls = stage === 'done' ? (s.resultFlash === 'ok' ? 'ok' : 'no') : '';
  return `<section class="card">
    <h2>今日复习 <span class="muted" style="font-size:13px;font-weight:400">${s.reviewIndex + 1} / ${s.reviewList.length}</span></h2>
    <div class="review-card">
      <div class="review-head">
        <h3 class="review-word">${esc(v.w)}</h3>
        <span class="review-timer" id="review-timer">计时 0 / ${settings.recognizeSeconds} 秒</span>
      </div>
      <div class="review-meaning">${meaning}</div>
      <div class="review-blank">${blanked || '<span class="muted">（原句缺失，请直接输入单词）</span>'}</div>
      <input class="review-input ${inputCls}" id="reviewInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        value="${esc(s.reviewInput || '')}" placeholder="在此输入单词" ${stage === 'done' ? 'disabled' : ''}>
      ${answerHTML}
      ${actions}
    </div>
  </section>`;
}

/* ===================== 记录页 ===================== */
function historyHTML() {
  const n = history.length;
  const totalSec = history.reduce((a, h) => a + (h.duration || 0), 0);
  const right = history.reduce((a, h) => a + (h.right || 0), 0);
  const count = history.reduce((a, h) => a + (h.count || 0), 0);
  const acc = count ? Math.round(right / count * 100) : null;

  let h = `<section class="card"><h2>学习记录</h2>
    <div class="statgrid">
      <div class="stat">累计练习<b>${n}</b></div>
      <div class="stat ${acc === null ? '' : (acc >= 60 ? 'ok' : 'warn')}">平均正确率<b>${acc === null ? '—' : acc + '%'}</b></div>
      <div class="stat">累计时长<b>${fmtDuration(totalSec)}</b></div>
      <div class="stat">练习次数<b>${history.length}</b></div>
    </div></section>`;

  // 能力画像
  h += '<section class="card"><h2>能力画像</h2>';
  if (history.length < 5) {
    h += `<p class="empty">数据积累中（已完成 ${history.length} / 5 次）</p>`;
  } else {
    const recent = history.slice().sort((a, b) => b.date - a.date).slice(0, 10);
    const rAvg = recent.reduce((a, x) => a + (x.right || 0), 0) / Math.max(1, recent.reduce((a, x) => a + (x.count || 0), 0));
    const perQ = recent.reduce((a, x) => a + (x.duration || 0), 0) / Math.max(1, recent.reduce((a, x) => a + (x.count || 0), 0));
    const vocabScore = Math.min(100, vocab.length);
    h += `<div class="bars">
      ${barRow('正确率', Math.round(rAvg * 100), rAvg >= 0.6 ? '' : 'warn')}
      ${barRow('答题速度', Math.round(clamp(100 - perQ * 4, 5, 100)), perQ > 22 ? 'warn' : '')}
      ${barRow('词汇积累', vocabScore, vocabScore < 30 ? 'warn' : '')}
    </div>
    <p class="muted">答题速度：平均每道有答案的题用时 ${perQ.toFixed(1)} 秒。词汇积累按生词本规模估算。</p>`;
  }
  h += '</section>';

  // 趋势
  h += '<section class="card"><h2>趋势</h2>';
  if (!history.length) h += '<p class="empty">还没有数据。</p>';
  else {
    const last12 = history.slice().sort((a, b) => a.date - b.date).slice(-12);
    h += `<div class="chart-wrap"><div class="chart-title">正确率趋势（最近 ${last12.length} 次）</div>${lineChart(last12.map(x => x.score), 100)}</div>`;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0, 0, 0, 0);
      const sec = history.filter(x => isSameDay(x.date, d.getTime())).reduce((a, x) => a + (x.duration || 0), 0);
      days.push({ label: (d.getMonth() + 1) + '/' + d.getDate(), v: sec });
    }
    const max = Math.max(60, ...days.map(d => d.v));
    h += `<div class="chart-wrap"><div class="chart-title">近 7 天学习时长</div><div class="bars">${days.map(d =>
      `<div class="bar-row"><div class="bl"><span>${d.label}</span><span>${fmtDuration(d.v)}</span></div>
       <div class="bar-track"><div class="bar-fill" style="width:${(d.v / max * 100).toFixed(0)}%"></div></div></div>`).join('')}</div></div>`;
  }
  h += '</section>';

  // 表格
  h += '<section class="card"><h2>历史明细</h2>';
  if (!history.length) h += '<p class="empty">还没有学习记录。</p>';
  else {
    h += `<div style="overflow-x:auto"><table class="history"><thead><tr><th>日期</th><th>资料</th><th>对/总</th><th>得分</th><th>用时</th></tr></thead><tbody>
      ${history.slice().sort((a, b) => b.date - a.date).map(x => `<tr>
        <td>${fmtDate(x.date)}</td><td>${esc(x.label)}<div class="mini">${esc(x.mode || '')}</div></td>
        <td>${x.right}/${x.count}</td><td>${x.score}</td><td>${fmtDuration(x.duration || 0)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="btns" style="justify-content:flex-start;margin-top:12px"><button class="danger" data-act="clearHistory">清空记录</button></div>`;
  }
  return h + '</section>';
}

function barRow(label, val, cls) {
  return `<div class="bar-row"><div class="bl"><span>${esc(label)}</span><span>${val}</span></div>
    <div class="bar-track"><div class="bar-fill ${cls || ''}" style="width:${clamp(val, 0, 100)}%"></div></div></div>`;
}

function lineChart(values, max) {
  const w = 600, hgt = 160, pad = 26;
  if (!values.length) return '<p class="muted">暂无数据</p>';
  const n = values.length;
  const x = i => pad + (n === 1 ? (w - pad * 2) / 2 : i * (w - pad * 2) / (n - 1));
  const y = v => hgt - pad - (clamp(v, 0, max) / max) * (hgt - pad * 2);
  const pts = values.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const dots = values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#2a4bd7"/>`).join('');
  const grid = [0, 25, 50, 75, 100].map(g =>
    `<line x1="${pad}" y1="${y(g).toFixed(1)}" x2="${w - pad}" y2="${y(g).toFixed(1)}" stroke="#e3e8f0" stroke-width="1"/>
     <text x="4" y="${(y(g) + 4).toFixed(1)}" font-size="10" fill="#667089">${g}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none">${grid}
    <polyline points="${pts}" fill="none" stroke="#2a4bd7" stroke-width="2"/>${dots}</svg></div>`;
}

};

function rich(text) {
  const s = String(text || '');
  const parts = [];
  let sentenceStart = 0;
  const re = /⟦(\d+)⟧|([A-Za-z][A-Za-z'\-]*)|([^A-Za-z⟦]+)/g;
  let m;
  while ((m = re.exec(s))) {
    if (m[1]) {
      parts.push('<span class="blank" id="blank-' + m[1] + '" data-act="blank" data-no="' + m[1] + '"><sup>' + m[1] + '</sup></span>');
    } else if (m[2]) {
      const w = m[2];
      const low = w.toLowerCase();
      const end = m.index + w.length;
      if (w.length >= 4 && !STOP[low]) {
        const head = s.slice(Math.max(0, sentenceStart), m.index);
        const sm = /[.!?]\s+[^.!?]*$/.exec(head);
        const off = sm ? sm.index + sm[0].length : 0;
        const sentence = clean(s.slice(Math.max(0, sentenceStart) + off, Math.min(s.length, end + 120)));
        parts.push('<span class="w' + (vocabSet.has(lemmatize(w)) ? ' saved' : '') + '" data-act="word" data-w="' + esc(lemmatize(w)) + '" data-s="' + esc(sentence) + '">' + esc(w) + '</span>');
      } else {
        parts.push(esc(w));
      }
    } else {
      const t = m[3];
      parts.push(esc(t));
      if (/[.!?]/.test(t)) sentenceStart = m.index + t.length;
    }
  }
  return parts.join('');
}
